<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Growth Day Cohort</title>
<meta name="theme-color" content="#1C2340">
<meta name="description" content="Grow 1% a day for 42 days. The 6-week Growth Day cohort, led by Dr. Denis Ekobena (Equip2Lead). In English and French.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://growthday.cc/cohort/">
<meta property="og:title" content="Grow 1% a day for 42 days · Growth Day Cohort">
<meta property="og:description" content="A 6-week cohort: the Daily Fire at 6:00, your 1% Card each night, a triad that keeps you going. English & français.">
<meta property="og:image" content="https://growthday.cc/cohort/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://growthday.cc/cohort/og-image.jpg">

<link rel="icon" href="https://growthday.cc/growing-flame.png">
<link rel="apple-touch-icon" href="/cohort/icon-180.png">
<link rel="manifest" href="/cohort/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Growth Day">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C2340; --text:#1C2340; --muted:#5B6480; --bg:#F3F6FB; --surface:#FFFFFF;
  --line:#D6DDEA; --ember:#E8890C; --glow:#FFC94D; --leaf:#2F855A; --danger:#B42318;
  --ember-text:#A35F00;
  --display:"Sora", "Segoe UI", system-ui, sans-serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --text:#EEF1F8; --muted:#A3ACC4; --bg:#121729; --surface:#1C2340; --line:#2E3758; --ember-text:#FFB547; }
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:400 17px/1.55 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding:20px 18px 110px}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0}
h1{font-size:30px;font-weight:700;letter-spacing:-.01em}
h2{font-size:22px;font-weight:600}
h3{font-size:17px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:15px}
.stack>*+*{margin-top:14px}
.stack-lg>*+*{margin-top:26px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:16px}
.brand img{width:34px;height:34px;object-fit:contain}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langs button{border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:6px 12px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:#fff}
@media (prefers-color-scheme: dark){.langs button[aria-pressed="true"]{background:var(--ember);color:#1C2340}}
label{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
input,textarea,select{width:100%;font:400 17px var(--body);color:var(--text);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ember)}
:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.hint{font-size:14px;color:var(--muted);margin-top:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;padding:15px 18px;font:600 17px var(--display);cursor:pointer;text-decoration:none}
.btn-primary{background:var(--ember);color:#1C2340}
.btn-dark{background:var(--ink);color:#fff}
@media (prefers-color-scheme: dark){.btn-dark{background:#2E3758}}
.btn-ghost{background:none;color:var(--text);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.55;cursor:default}
.link{background:none;border:0;padding:0;color:var(--ember-text);font:600 16px var(--body);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.err{color:var(--danger);font-weight:600;font-size:15px}
@media (prefers-color-scheme: dark){.err{color:#FF8A80}}
.ok{color:var(--leaf);font-weight:600}
@media (prefers-color-scheme: dark){.ok{color:#68D391}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.chips{display:grid;grid-template-columns:1fr;gap:8px}
.chip{text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:11px 14px;font:400 15px/1.35 var(--body);cursor:pointer}
.chip b{display:block;font-family:var(--display);font-weight:600;font-size:15.5px}
.chip[aria-pressed="true"]{border-color:var(--ember);box-shadow:inset 0 0 0 1.5px var(--ember)}
.chip[aria-pressed="true"] b::after{content:" ✓";color:var(--ember-text)}
.chip:disabled{opacity:.45}

.credit{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);text-align:center}
.credit b{font-weight:600;color:var(--text)}


/* ---------- landing ---------- */
.land{--max:1120px}
.lh{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.lh-in{position:relative;min-height:100svh;display:flex;flex-direction:column;max-width:var(--max);margin:0 auto}
.lh-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--ink)}
.lh-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,35,64,.85) 0%,rgba(28,35,64,.15) 22%,rgba(28,35,64,.82) 58%,#1C2340 100%)}
.lnav{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:18px 20px}
.lnav .brand{color:#fff}
.lnav-r{display:flex;gap:16px;align-items:center}
.lt{color:#fff}
.lh .langs{border-color:rgba(255,255,255,.35)}
.lh .langs button{color:rgba(255,255,255,.85)}
.lh .langs button[aria-pressed="true"]{background:#fff;color:#1C2340}
.lh-copy{position:relative;z-index:2;margin-top:auto;padding:0 20px 36px;max-width:640px}
.pill{display:inline-block;background:var(--ember);color:#1C2340;font-weight:600;border-radius:999px;padding:6px 14px;font-size:15px}
.lh-title{font-size:clamp(46px,11.5vw,88px);line-height:.98;letter-spacing:-.03em;margin:18px 0 16px;font-weight:700}
.lh-sub{font-size:18px;opacity:.9;max-width:32em}
.lh-cta{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.btn-glass{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lh-proof{margin-top:16px;font-size:15px;opacity:.78}
@media (min-width:900px){
  .lh{background:radial-gradient(760px 520px at 78% 45%,rgba(232,137,12,.25),transparent 62%),var(--ink)}
  .lh-in{display:grid;grid-template-columns:1.15fr .85fr;grid-template-rows:auto 1fr;min-height:auto;padding-bottom:72px;column-gap:56px}
  .lnav{grid-column:1/-1;grid-row:1}
  .lh-copy{grid-column:1;grid-row:2;align-self:center;margin:0;padding:24px 20px}
  .lh-video{position:relative;inset:auto;grid-column:2;grid-row:2;height:min(76vh,700px);width:auto;aspect-ratio:9/16;justify-self:center;border-radius:36px;border:8px solid #0E1328;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08)}
  .lh-shade{display:none}
  .lh-cta{flex-direction:row}
  .lh-cta .btn{width:auto}
}
.ls{padding:76px 20px}
.lin{max-width:var(--max);margin:0 auto}
.lin.two{display:grid;gap:40px}
@media (min-width:900px){.lin.two{grid-template-columns:1fr 1fr;align-items:center;gap:72px}}
.ls h2{font-size:clamp(32px,5.4vw,50px);letter-spacing:-.025em;font-weight:700;margin-bottom:14px}
.lead{font-size:19px;color:var(--muted);max-width:32em}
.ls-alt{background:var(--surface)}
.ls-dark{background:var(--ink);color:#fff}
.ls-dark .lead{color:rgba(255,255,255,.78)}
.cnum{font-family:var(--display);font-size:clamp(84px,16vw,140px);font-weight:700;line-height:1;color:var(--ember-text);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 14px;margin-top:22px}
.bar-l{grid-column:1/-1;font-weight:600;font-size:15px}
.track{height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.fill{display:block;height:100%;width:0;border-radius:99px;transition:width 1.4s cubic-bezier(.2,.7,.2,1)}
.on .fill{width:var(--w)}
.fill.up{background:var(--ember)}
.fill.down{background:var(--muted)}
.bar b{font-family:var(--display);font-size:18px}
.rhythm{list-style:none;padding:0;margin:26px 0 0}
.rhythm li{display:grid;grid-template-columns:88px 1fr;gap:2px 16px;padding:16px 0;border-top:1px solid var(--line)}
.rhythm time{font-family:var(--display);font-weight:700;color:var(--ember-text);grid-row:span 2}
.rhythm h3{font-size:18px}
.rhythm p{color:var(--muted)}
.more{margin-top:18px;color:var(--muted)}
.demo{background:var(--ink);border-radius:26px;padding:24px;color:#fff;max-width:440px;width:100%;justify-self:center}
.demo .flames .h,.demo .flames .w{color:rgba(255,255,255,.55)}
.demo .f-miss path,.demo .f-future path{stroke:rgba(255,255,255,.3)}
.demo .fl{cursor:default}
.demo-cap{margin-top:16px;opacity:.82;font-size:15px}
.arc{list-style:none;padding:0;margin:30px 0 0;display:grid;gap:12px}
@media (min-width:700px){.arc{grid-template-columns:repeat(3,1fr)}}
.arc li{border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:20px}
.arc .wk{font-size:14px;opacity:.6;font-weight:600}
.arc h3{font-size:24px;margin:4px 0 6px;color:var(--glow)}
.arc p{opacity:.84}
.lchips{display:grid;grid-template-columns:1fr;gap:10px;margin:26px 0 20px}
@media (min-width:700px){.lchips{grid-template-columns:repeat(3,1fr)}}
.lgo{max-width:340px}
.leader{display:grid;gap:30px;align-items:center}
@media (min-width:800px){.leader{grid-template-columns:300px 1fr;gap:56px}}
.portrait{aspect-ratio:4/5;border-radius:26px;background:var(--ink);display:grid;place-items:center;overflow:hidden;color:var(--glow);font-family:var(--display);font-size:76px;font-weight:700;max-width:300px;width:100%}
.portrait img{width:100%;height:100%;object-fit:cover}
.faq{margin-top:20px}
.faq details{border-top:1px solid var(--line);padding:18px 0}
.faq summary{font-family:var(--display);font-weight:600;font-size:18px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--ember-text);font-size:24px;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq details p{margin-top:8px;color:var(--muted);max-width:40em}
.final .btn{margin-top:26px;max-width:340px}
.land .credit{margin:0;padding:28px 20px 44px;background:var(--ink);color:rgba(255,255,255,.62);border-top:1px solid rgba(255,255,255,.1)}
.land .credit b{color:#fff}

.watch{display:inline-block;margin-top:14px;font-size:16px}
.recap{border:0;padding:0;background:transparent;max-width:min(92vw,420px);width:100%}
.recap::backdrop{background:rgba(10,14,30,.88)}
.recap video{width:100%;max-height:86vh;border-radius:20px;display:block;background:#000}
.recap-x{position:absolute;top:8px;right:8px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:24px;cursor:pointer}
.auto-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-top:1px solid var(--line);padding-top:14px}
.switch{flex:none;width:52px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer}
.switch span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.switch[aria-pressed="true"]{background:var(--leaf)}
.switch[aria-pressed="true"] span{left:25px}
.preview{border-top:1px solid var(--line);padding-top:14px}
pre.wa{white-space:pre-wrap;word-wrap:break-word;font:400 15px/1.45 var(--body);background:#DCF8C6;color:#111;border-radius:12px;padding:12px 14px;margin:0}

/* ---------- signup ---------- */
.is-auth{background:var(--bg)}
.auth{max-width:520px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column}
.auth-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--bg)}
.auth-top .langs{margin-left:auto}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font-size:20px;cursor:pointer;flex:none}
.steps{display:flex;gap:6px;flex:1;max-width:180px}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--ember)}
.auth-body{padding:8px 20px 150px;flex:1}
.auth-body h1{font-size:clamp(30px,8vw,40px);letter-spacing:-.02em;margin:6px 0 10px}
.step-lbl{font-weight:600;color:var(--ember-text);font-size:15px}
.auth-cta{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,var(--bg) 26%)}
.auth-cta>*{max-width:480px;margin-left:auto;margin-right:auto}
.auth-cta .err{min-height:0;margin-bottom:8px}
.auth-cta .err:empty{display:none}
.phone-row{display:grid;grid-template-columns:116px 1fr;gap:8px}
.phone-row select{padding:12px 8px}
.tiles9{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.atile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:16px;padding:14px 12px;cursor:pointer;font:400 13.5px/1.35 var(--body);position:relative}
.atile b{font-family:var(--display);font-size:15px;font-weight:600;line-height:1.25}
.atile span:last-child{color:var(--muted)}
.atile .ai{font-size:26px;line-height:1}
.atile[aria-pressed="true"]{border-color:var(--ember);box-shadow:inset 0 0 0 1.5px var(--ember);background:color-mix(in srgb,var(--ember) 8%,var(--surface))}
.atile[aria-pressed="true"]::after{content:"✓";position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--ember);color:#1C2340;font-weight:700;font-size:13px;display:grid;place-items:center}
.atile:disabled{opacity:.45;cursor:default}
.pin-wrap{display:flex;align-items:center;gap:14px;margin-top:22px}
.pin{font-family:var(--display);font-size:34px;letter-spacing:.6em;text-align:center;padding:12px 0 12px .6em;max-width:220px}
.summary{margin-top:28px;border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--surface)}
.mini-areas{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mini-areas span{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:600}
.done .auth-body{padding-top:56px;text-align:left}
.big-flame{width:96px;height:96px;margin-bottom:18px}
.big-flame svg{width:100%;height:100%}
.big-flame path{fill:var(--ember);stroke:var(--ember);transform-origin:50% 75%}
@media (prefers-reduced-motion:no-preference){.big-flame path{animation:ignite .9s cubic-bezier(.2,.8,.2,1.3)}}
.lead-s{font-size:18px;color:var(--muted)}
.tip{margin-top:28px}
.tip h3{margin-bottom:4px}

/* ---------- dashboard ---------- */
.app-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hello{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1}
.app-top-r{display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:50%;border:0;background:var(--ink);color:var(--glow);font:700 15px var(--display);cursor:pointer}
@media (prefers-color-scheme: dark){.avatar{background:#2E3758}}
.hero2{background:var(--ink);color:#fff;border-radius:24px;padding:22px;display:flex;align-items:center;gap:20px}
.hero2-col{flex-direction:column;align-items:stretch}
.hero2-row{display:flex;align-items:center;gap:20px}
.hero2-t p{opacity:.8}
.hero2-t h2{font-size:21px;margin-top:4px;line-height:1.25}
.hero2-t .streak{margin-top:8px}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring-bg{stroke:rgba(255,255,255,.14)}
.ring-fg{stroke:var(--ember);stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.ring-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-t b{font-family:var(--display);font-size:32px;line-height:1}
.ring-t span{font-size:12px;opacity:.75;max-width:70px;line-height:1.2;margin-top:2px}
.wlbl{font-size:13px;font-weight:600;opacity:.6;margin-bottom:6px}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px}
.wd.is-today{background:rgba(255,255,255,.08)}
.wd .fl{width:30px;height:30px;cursor:default}
.wd small{font-size:12px;opacity:.65}
.hero2 .f-miss path,.hero2 .f-future path{stroke:rgba(255,255,255,.3)}
.sec{font-size:20px}
.mine{display:grid;gap:10px}
.mine-a{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.mine-a .ai,.ctile .ai{font-size:28px;line-height:1}
.next{list-style:none;padding:0;margin:0;border-left:2px solid var(--line);margin-left:6px}
.next li{position:relative;padding:0 0 16px 20px;display:flex;flex-direction:column}
.next li::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--ember)}
.next li span{color:var(--muted)}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:118px;text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--text);border-radius:18px;padding:14px;cursor:pointer;font:600 15px/1.3 var(--display)}
.ctile .tick{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-size:15px;transition:all .15s}
.ctile[aria-pressed="true"]{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 10%,var(--surface))}
.ctile[aria-pressed="true"] .tick{background:var(--leaf);border-color:var(--leaf);color:#fff}
.notes summary{cursor:pointer;color:var(--ember-text);font-weight:600;font-size:15px}

.admin .wrap{max-width:1180px}
.wk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.wk-col{display:flex;flex-direction:column;gap:6px}
.wk-col h3{font-size:15px;margin-bottom:2px}
.dcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:8px 10px;cursor:pointer;font:400 14px/1.3 var(--body)}
.dcard b{font-family:var(--display);font-weight:600;font-size:14px}
.dcard .dnum{font-size:12px;color:var(--muted)}
.dcard .dbadges{font-size:12px;color:var(--leaf)}
.dcard.empty{border-style:dashed;opacity:.7}
.dcard.empty b{color:var(--muted);font-weight:500}
.dcard.sel{border-color:var(--ember);box-shadow:inset 0 0 0 1.5px var(--ember);opacity:1}
.hw{background:color-mix(in srgb,var(--ember) 9%,var(--surface));border-radius:14px;padding:12px 14px}
.hw-l{font-size:13px;font-weight:600;color:var(--ember-text)}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}

async function rpc(fn, args){
  let res;
  try{
    res = await fetch(API + fn, {method:"POST", headers:{"Content-Type":"application/json", apikey:KEY, Authorization:"Bearer "+KEY}, body:JSON.stringify(args||{})});
  }catch(e){ throw new Error("network"); }
  const txt = await res.text();
  let data = null; try{ data = txt ? JSON.parse(txt) : null }catch(e){}
  if(!res.ok){ throw new Error((data && data.message) || "network"); }
  return data;
}

async function callApp(body){
  let res; try{ res = await fetch(APPFN, {method:"POST", headers:{"Content-Type":"application/json", apikey:KEY}, body:JSON.stringify(body)}); }catch(e){ throw new Error("network"); }
  const d = await res.json().catch(()=>({}));
  if(!res.ok || d.error) throw new Error(d.error || "network");
  return d;
}

function demoFlames(){
  const st = d => d>13 ? "future" : d===13 ? "open" : [4,9].includes(d) ? "one" : d===7 ? "miss" : "both";
  let h = `<div class="flames"><span></span>${t().days.map(x=>`<span class="h">${x}</span>`).join("")}`;
  for(let w=1; w<=6; w++){
    h += `<span class="w">${lang==="fr"?"S":"W"}${w}</span>`;
    for(let i=1;i<=7;i++){ const d=(w-1)*7+i; h += `<span class="fl f-${st(d)} ${d===13?"today":""}">${FLAME}</span>`; }
  }
  return h + `</div>`;
}

async function boot(){

  root.innerHTML = `<div class="wrap"><p class="muted">${t().loading}</p></div>`;

const state = d => { const c = ck(d); if(!c) return "miss"; return c.done1 && c.done2 ? "both" : (c.done1 || c.done2) ? "one" : "miss"; };
function streak(){
  const cur = Math.min(me.day, 42); let s = 0;
  let d = state(cur) !== "miss" ? cur : cur - 1;
  while(d >= 1 && state(d) !== "miss"){ s++; d--; }
  return s;
}
function flameGrid(onDark){
  const cur = me.day;
  let h = `<div class="flames"><span></span>${t().days.map(x=>`<span class="h">${x}</span>`).join("")}`;
  for(let w=1; w<=6; w++){
    h += `<span class="w">${lang==="fr"?"S":"W"}${w}</span>`;
    for(let i=1;i<=7;i++){
      const d = (w-1)*7+i;
      let cls = d > cur ? "future" : state(d);
      if(d === cur && cls === "miss") cls = "open";
      const lbl = `${t().dayDetail(d)}: ${cls==="both"?t().legBoth:cls==="one"?t().legOne:cls==="future"?t().legFut:t().legMiss}`;
      h += `<button class="fl f-${cls} ${d===cur?"today":""} ${lastSaved===d?"lit-now":""}" data-day="${d}" aria-label="${esc(lbl)}" ${d>cur?"disabled":""}>${FLAME}</button>`;
    }
  }
  return h + `</div>`;
}

    <div class="ring-t"><b>${big}</b><span>${small}</span></div></div>`;
}

function curveBlock(){
  const T_ = t(), p1 = planOf("1").score, p2 = planOf("2").score;
  const pts = [[0, p1, p2]].concat((me.scores||[]).map(s=>[s.week, s.score1, s.score2]));
  if(!me.scores || !me.scores.length) return `<p class="muted">${T_.curveEmpty}</p>`;
  const W=320, H=180, padL=26, padB=24, padT=12, padR=12;
  const x = w => padL + (w/6)*(W-padL-padR), y = v => padT + (1-(v-1)/9)*(H-padT-padB);
  const line = (idx, cls) => { const ps = pts.filter(p=>p[idx]); if(!ps.length) return "";
    return `<polyline class="${cls}" points="${ps.map(p=>`${x(p[0]).toFixed(1)},${y(p[idx]).toFixed(1)}`).join(" ")}"/>` +
      ps.map(p=>`<circle class="${cls}" cx="${x(p[0]).toFixed(1)}" cy="${y(p[idx]).toFixed(1)}" r="3.5"/>`).join(""); };
  const grid = [1,5,10].map(v=>`<line class="g" x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}"/><text class="gl" x="${padL-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join("");
  const xs = [0,1,2,3,4,5,6].map(w=>`<text class="gl" x="${x(w)}" y="${H-6}" text-anchor="middle">${w===0?T_.startLbl:(lang==="fr"?"S":"W")+w}</text>`).join("");
  return `<div class="panel"><svg class="curve" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T_.curveTitle)}">${grid}${xs}${line(1,"c1")}${line(2,"c2")}</svg>
    <div class="legend"><span><i class="k1"></i>${AREA_ICON[me.area1-1]} ${esc(areaName(me.area1))}</span><span><i class="k2"></i>${AREA_ICON[me.area2-1]} ${esc(areaName(me.area2))}</span></div></div>`;
}
function bestStreak(){ let b=0,c=0; for(let d=1; d<=Math.min(42,me.day); d++){ if(state(d)!=="miss"){ c++; b=Math.max(b,c);} else c=0; } return b; }
function reportBlock(){
  const T_ = t(), done = me.checkins.filter(c=>c.done1||c.done2).length, last = (me.scores||[]).slice(-1)[0] || {};
  const row = (k,a) => { const s0 = planOf(String(k)).score, s1 = last["score"+k]; return `<div class="rep-a"><span class="ai">${AREA_ICON[a-1]}</span><b>${esc(areaName(a))}</b><span class="rep-s">${s0||"–"} → ${s1||"–"}</span></div>`; };
  return `<section class="hero2 hero2-col report"><div><p>${T_.reportSub}</p><h2>${T_.reportTitle}</h2></div>
      <div class="rep-stats"><div><b>${done}</b><span>${T_.daysDone}</span></div><div><b>${bestStreak()}</b><span>${T_.bestStreak}</span></div></div>
      ${row(1,me.area1)}${row(2,me.area2)}
      <button class="btn btn-primary" id="cert">${T_.certBtn}</button></section>
    <section class="panel stack"><h2>${T_.testiTitle}</h2><p class="muted small">${T_.testiSub}</p>
      <textarea id="testi" rows="5" maxlength="1200">${esc(me.testimony||"")}</textarea>
      <label class="check"><input type="checkbox" id="testiPub" ${me.testimony_public?"checked":""}> ${T_.testiPublic}</label>
      <p id="testiMsg" role="status"></p><button class="btn btn-dark" id="testiSave">${T_.testiSave}</button></section>`;
}
async function makeCertificate(){
  const T_ = t(), c = document.createElement("canvas"); c.width = 1080; c.height = 1350; const g = c.getContext("2d");
  try{ await document.fonts.load("700 40px Sora"); }catch(e){}
  g.fillStyle = "#1C2340"; g.fillRect(0,0,1080,1350);
  const grd = g.createRadialGradient(860,260,40,860,260,620); grd.addColorStop(0,"rgba(232,137,12,.35)"); grd.addColorStop(1,"rgba(232,137,12,0)"); g.fillStyle = grd; g.fillRect(0,0,1080,1350);
  const flame = new Path2D("M12 2.5c.6 3.2-1.4 4.9-3 6.9C7.4 11.3 6 13 6 15.3A6 6 0 0 0 18 15.3c0-2.7-1.5-4.4-2.6-5.5-.2 1.6-.9 2.6-2 3 .6-3.6-.2-7.4-1.4-10.3Z");
  g.save(); g.translate(90,110); g.scale(7,7); g.fillStyle = "#E8890C"; g.fill(flame); g.restore();
  g.fillStyle = "#FFC94D"; g.font = "600 34px Sora, sans-serif"; g.fillText("Growth Day · " + (lang==="fr"?"Cohorte 6 semaines":"6-week cohort"), 90, 330);
  g.fillStyle = "#fff"; g.font = "700 84px Sora, sans-serif";
  (lang==="fr"?["Certificat","de croissance"]:["Certificate","of Growth"]).forEach((l,i)=>g.fillText(l, 90, 450+i*96));
  g.font = "400 34px Sora, sans-serif"; g.fillStyle = "rgba(255,255,255,.75)"; g.fillText(lang==="fr"?"décerné à":"awarded to", 90, 690);
  g.font = "700 64px Sora, sans-serif"; g.fillStyle = "#fff"; g.fillText(String(me.name).slice(0,28), 90, 770);
  const done = me.checkins.filter(x=>x.done1||x.done2).length, last = (me.scores||[]).slice(-1)[0] || {};
  g.font = "600 36px Sora, sans-serif"; g.fillStyle = "#FFC94D";
  g.fillText(`${done}/42 ${lang==="fr"?"jours":"days"} · ${lang==="fr"?"série record":"best streak"} ${bestStreak()}`, 90, 870);
  [[1,me.area1],[2,me.area2]].forEach(([k,a],i)=>{ g.fillStyle="#fff"; g.font="400 36px Sora, sans-serif";
    g.fillText(`${areaName(a)}: ${planOf(String(k)).score||"–"} → ${last["score"+k]||"–"} / 10`, 90, 960+i*60); });
  g.fillStyle = "rgba(255,255,255,.6)"; g.font = "400 28px Sora, sans-serif";
  g.fillText("Equip2Lead · Dr. Denis Ekobena · growthday.cc", 90, 1250);
  return new Promise(r => c.toBlob(r, "image/png"));
}

function bindView(){
  const tok = store.get("gd_token");
  // flames
  document.querySelectorAll(".fl[data-day]").forEach(b => b.onclick = () => {
    const d = +b.dataset.day; const box = $("#detail");
    if(tab === "today" || !box){ return; }
    const l = me.lessons.find(x=>x.day===d), c = ck(d);
    box.innerHTML = `<div class="panel stack"><h2>${t().dayDetail(d)} · ${esc(L(l,"title")||L(l,"theme"))}</h2>
      ${L(l,"principle")?`<p>${esc(L(l,"principle"))}</p>`:""}
      ${c ? [[1,me.area1],[2,me.area2]].map(([k,a])=>`<p><b>${esc(areaName(a))}:</b> ${c["done"+k]?"✓ "+t().yes:t().no}${c["note"+k]?" · "+esc(c["note"+k]):""}</p>`).join("") : `<p class="muted">${t().notFilled}</p>`}
      ${d >= me.day-1 && d <= me.day ? `<button class="btn btn-ghost" id="editDay">${t().editCard}</button>`:""}</div>`;
    const ed = $("#editDay"); if(ed) ed.onclick = () => { tab="today"; cardDay = d===me.day?null:d; renderApp(); };
    box.scrollIntoView({behavior:"smooth", block:"nearest"});
  });
  const tt = $("#toToday"); if(tt) tt.onclick = () => { cardDay = null; renderApp(); };
  const cu = $("#catch"); if(cu) cu.onclick = () => { cardDay = me.day-1; renderApp(); window.scrollTo(0,0); };
  // card
  const card = $("#card");
  if(card){
    const d = +card.dataset.d; const c = ck(d) || {};
    const val = {1: c.done1 ?? null, 2: c.done2 ?? null};
    card.querySelectorAll("[data-tile]").forEach(b => b.onclick = () => {
      const k = b.dataset.tile; val[k] = !val[k]; b.setAttribute("aria-pressed", !!val[k]);
    });
    $("#saveCard").onclick = async () => {
      const btn = $("#saveCard"); btn.disabled = true;
      try{
        const args = {p_token:tok, p_day:d, p_done1:!!val[1], p_done2:!!val[2], p_note1:$("#note1").value, p_note2:$("#note2").value};
        await rpc("gd_checkin", args);
        const row = {day:d, done1:args.p_done1, done2:args.p_done2, note1:args.p_note1, note2:args.p_note2};
        me.checkins = me.checkins.filter(x=>x.day!==d).concat(row);
        lastSaved = d; cardDay = null; renderApp();
        const m = $("#cardMsg"); if(m){ m.className="ok"; m.textContent = t().saved; }
      }catch(e){ btn.disabled = false; const m=$("#cardMsg"); m.className="err"; m.textContent = errMsg(e); }
    };
  }
  // score
  const sc = $("#score");
  if(sc){
    [1,2].forEach(k => { const r = $("#s"+k); r.oninput = () => { $("#o"+k).textContent = r.value; }; });
    $("#saveScore").onclick = async () => {
      const w = +sc.dataset.w; const btn = $("#saveScore"); btn.disabled = true;
      try{
        const a = {p_token:tok, p_week:w, p_s1:+$("#s1").value, p_s2:+$("#s2").value, p_reflection:$("#refl").value};
        await rpc("gd_score", a);
        me.scores = me.scores.filter(x=>x.week!==w).concat({week:w, score1:a.p_s1, score2:a.p_s2, reflection:a.p_reflection}).sort((x,y)=>x.week-y.week);
        btn.disabled = false; const m=$("#scoreMsg"); m.className="ok"; m.textContent = t().scoreSaved;
      }catch(e){ btn.disabled = false; const m=$("#scoreMsg"); m.className="err"; m.textContent = errMsg(e); }
    };
  }
  // me
  document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
    const n = +b.dataset.pick, p = viewMe.picked || [me.area1, me.area2];
    viewMe.picked = p.includes(n) ? p.filter(x=>x!==n) : [...p, n].slice(0,2); renderApp();
  });
  const sm = $("#saveMe");
  if(sm) sm.onclick = async () => {
    const p = viewMe.picked || [me.area1, me.area2]; const m = $("#meMsg");
    if(p.length !== 2){ m.className="err"; m.textContent = t().err.areas_needed; return; }
    sm.disabled = true;
    try{ await rpc("gd_update_profile", {p_token:tok, p_lang:lang, p_area1:p[0], p_area2:p[1]});
      me.area1 = p[0]; me.area2 = p[1]; viewMe.picked = null; renderApp();
      const m2 = $("#meMsg"); m2.className="ok"; m2.textContent = t().changesSaved;
    }catch(e){ sm.disabled = false; m.className="err"; m.textContent = errMsg(e); }
  };
  const so = $("#signOut"); if(so) so.onclick = () => { store.del("gd_token"); me = null; tab="today"; welcome(); };
}

function pStats(p){

  while(d >= 1 && set.has(d)){ s++; d--; }
  const slipping = adm.day >= 2 && (!p.last_day || p.last_day < adm.day - 1);
  return {streak:s, total:p.days.length, slipping};
}

const FN = "https://vjnzvrhbzaqmzneirmjq.supabase.co/functions/v1/gd-send";

async function loadMessages(){
  try{ admMsg = await rpc("gd_admin_messages", {p_pin: admPin}); }
  catch(e){ admMsg = {configured:false, messages:[], err:e.message}; }
  if(admTab === "messages") adminRender();
  clearTimeout(msgTimer);
  if(admMsg.messages && admMsg.messages.some(m => m.status === "sending")) msgTimer = setTimeout(loadMessages, 5000);
}
async function callFn(body, isForm){
  const res = await fetch(FN, {method:"POST", headers: isForm ? {apikey:KEY} : {"Content-Type":"application/json", apikey:KEY}, body: isForm ? body : JSON.stringify(body)});
  const d = await res.json().catch(() => ({}));
  if(!res.ok || d.error) throw new Error(d.error || "network");
  return d;
}
function audienceCount(){
  const P = adm.participants;
  if(comp.aud === "all") return adm.pay.price>0 ? P.filter(p=>p.status==="paid").length : P.length;
  if(comp.aud === "slipping") return P.filter(p=>pStats(p).slipping).length;
  if(comp.aud === "lang") return P.filter(p=>p.lang===comp.val).length;
  if(comp.aud === "triad") return P.filter(p=>p.triad===comp.val).length;
  if(comp.aud === "test") return 1;
  if(comp.aud === "unpaid") return P.filter(p=>p.status==="pending").length;
  if(comp.aud === "waitlist") return P.filter(p=>p.status==="waitlist").length;
  return 0;
}

      <p class="muted small">Example for "Grace" (finances + spiritual growth). Would go to ${pv.recipients} ${pv.recipients===1?"person":"people"} right now${pv.media_url?", followed by the day's audio":""}.</p>
      <div class="grid2"><pre class="wa">${esc(pv.text_en)}</pre><pre class="wa">${esc(pv.text_fr)}</pre></div>`}
    </div>` : ""}
    <p id="autoMsg" role="status" class="${autoNote.startsWith("✓")?"ok":"err"}">${esc(autoNote)}</p>
  </div>`;
}
let autoPrev = null, autoNote = "";

function messagesView(){
  if(!admMsg) return `<p class="muted">Loading…</p>`;
  const P = adm.participants;
  const triads = [...new Set(P.map(p=>p.triad).filter(Boolean))].sort();
  const setup = `<div class="panel stack" style="max-width:620px">
      <h3>Connect your Wamatas WhatsApp</h3>
      <p class="muted small">Find these in your Wamatas dashboard on the Growth Day instance. They are stored on the server and never shown again.</p>
      <div><label for="waInst">Instance ID</label><input id="waInst" autocomplete="off"></div>
      <div><label for="waTok">Access token</label><input id="waTok" type="password" autocomplete="off"></div>
      <button class="btn btn-dark" id="waSave" style="max-width:240px">Save connection</button></div>`;
  const opt = (v, label, n) => `<option value="${esc(v)}" ${comp.aud+":"+comp.val===v||(comp.aud===v&&!comp.val)?"selected":""}>${esc(label)}${n!=null?` (${n})`:""}</option>`;
  const media = comp.media ? (() => { const u = esc(comp.media.url), n = comp.media.name;
      const prev = /\.(png|jpe?g|gif|webp)$/i.test(n) ? `<img src="${u}" alt="" style="max-width:220px;border-radius:10px">`
        : /\.(mp3|m4a|ogg|opus|wav|aac)$/i.test(n) ? `<audio controls src="${u}"></audio>`
        : /\.(mp4|mov|webm)$/i.test(n) ? `<video controls src="${u}" style="max-width:220px;border-radius:10px"></video>` : "";
      return `<div class="stack"><p class="ok">✓ Attached: ${esc(n)}</p>${prev}<button class="link" id="mRemove">Remove file</button></div>`; })()
    : `<div><label for="mFile">Attach an image, audio, video or PDF (optional, max 50 MB)</label><input type="file" id="mFile" accept="image/*,audio/*,video/*,application/pdf"></div>`;
  const hist = admMsg.messages.length ? `<div class="tablewrap"><table><thead><tr><th>When</th><th>To</th><th>Message</th><th>Sent</th><th>Status</th></tr></thead><tbody>
      ${admMsg.messages.map(m=>`<tr><td class="small">${new Date(m.created_at).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</td>
        <td class="small">${esc(m.audience)}</td>
        <td class="small">${esc((m.text_en||m.text_fr||"").slice(0,80))}${m.media_name?`<br>📎 ${esc(m.media_name)}`:""}</td>
        <td>${m.sent}/${m.total}${m.failed?` <span class="err">· ${m.failed} failed</span>`:""}</td>
        <td>${m.status==="sending"?"Sending…":"Done"}${m.failed?`<br><button class="link small" data-errs="${m.id}">See errors</button>`:""}</td></tr>`).join("")}
    </tbody></table></div>` : `<p class="muted">No messages sent yet.</p>`;
  return `<div class="stack-lg" style="max-width:780px">
    ${!admMsg.configured || showWaSetup ? setup : `<p class="ok">✓ WhatsApp connected (instance ${esc(admMsg.instance_hint)}) <button class="link" id="waChange">Change</button></p>`}
    ${admMsg.configured ? autoPanel() : ""}
    ${admMsg.configured ? `<div class="panel stack">
      <h3>New message</h3>
      <div><label for="mAud">Send to</label><select id="mAud">
        ${opt("all","Everyone",P.length)}
        ${opt("slipping","People slipping (no card yesterday or today)",P.filter(p=>pStats(p).slipping).length)}
        ${opt("lang:en","English speakers",P.filter(p=>p.lang==="en").length)}
        ${opt("lang:fr","French speakers",P.filter(p=>p.lang==="fr").length)}
        ${triads.map(x=>opt("triad:"+x,"Triad: "+x,P.filter(p=>p.triad===x).length)).join("")}
        ${adm.pay.price>0 ? opt("unpaid","Signed up but not paid yet",P.filter(p=>p.status==="pending").length) + opt("waitlist","Waiting list",P.filter(p=>p.status==="waitlist").length) : ""}
        ${opt("test","Test: send only to one number",null)}
      </select></div>
      ${comp.aud==="test"?`<div class="grid2"><div><label for="mTest">Test number</label><input id="mTest" type="tel" value="${esc(comp.testNum)}" placeholder="+237 6…"></div>
        <div><label for="mTestLang">Language to test</label><select id="mTestLang"><option value="en" ${comp.testLang==="en"?"selected":""}>English</option><option value="fr" ${comp.testLang==="fr"?"selected":""}>Français</option></select></div></div>`:""}
      <div class="grid2">
        <div><label for="mEn">Message in English</label><textarea id="mEn" rows="7">${esc(comp.en)}</textarea></div>
        <div><label for="mFr">Message en français</label><textarea id="mFr" rows="7">${esc(comp.fr)}</textarea></div>
      </div>
      <p class="muted small">Each person gets their own language. If one box is empty, everyone gets the other. Personalise with <b>{name}</b>, <b>{area1}</b> and <b>{area2}</b>. WhatsApp formatting works: *bold*, _italic_.</p>
      ${media}
      <p id="mMsg" role="status" class="${comp.note.startsWith("✓")?"ok":"err"}">${esc(comp.note)}</p>
      <button class="btn btn-primary" id="mSend" style="max-width:320px" ${comp.busy?"disabled":""}>Send to ${audienceCount()} ${audienceCount()===1?"person":"people"}</button>
      <p class="muted small">Messages go out one by one, a few seconds apart, so your number isn't flagged as spam. 30 people take about 3 minutes. You can close this page while it sends.</p>
    </div>` : ""}
    <div class="stack"><div class="top" style="margin:0"><h3>Sent messages</h3><button class="link" id="mRefresh">Refresh</button></div>${hist}</div>
  </div>`;
}

function bindMessages(){
  const keep = () => { const e=$("#mEn"), f=$("#mFr"), t=$("#mTest"), tl=$("#mTestLang"); if(e) comp.en=e.value; if(f) comp.fr=f.value; if(t) comp.testNum=t.value; if(tl) comp.testLang=tl.value; };
  const r = $("#mRefresh"); if(r) r.onclick = loadMessages;
  document.querySelectorAll("[data-auto]").forEach(b => b.onclick = async () => {
    keep(); const k = b.dataset.auto, on = !admMsg["auto_"+k];
    if(on && !confirm(k==="morning" ? "Turn on the automatic 6:00 Daily Fire for everyone?" : "Turn on the automatic 20:00 reminder?")) return;
    try{ await rpc("gd_admin_set_auto", {p_pin:admPin, p_kind:k, p_on:on}); admMsg["auto_"+k] = on;
      autoNote = on ? `✓ ${k==="morning"?"Daily Fire":"Evening reminder"} is on.` : `✓ ${k==="morning"?"Daily Fire":"Evening reminder"} is off.`; adminRender(); }
    catch(e){ autoNote = "Could not change: " + e.message; adminRender(); }
  });
  const showPrev = async (k, day) => {
    keep();
    try{ const d = await callFn({pin:admPin, action:"preview", kind:k, day}); autoPrev = {...d, kind:k, day:d.day || day}; autoNote = ""; }
    catch(e){ autoNote = "Preview failed: " + (ERR_WA[e.message] || e.message); }
    adminRender();
  };
  document.querySelectorAll("[data-prev]").forEach(b => b.onclick = () => showPrev(b.dataset.prev, Math.min(42, Math.max(1, adm.day))));
  const pd = $("#pvDay"); if(pd) pd.onchange = () => showPrev(autoPrev.kind, +pd.value);
  const pc = $("#pvClose"); if(pc) pc.onclick = () => { autoPrev = null; adminRender(); };
  document.querySelectorAll("[data-now]").forEach(b => b.onclick = async () => {
    keep(); const k = b.dataset.now;
    if(adm.day < 1 || adm.day > 42){ autoNote = "The cohort isn't running today, so there is no Daily Fire to send. Use Preview to check any day."; adminRender(); return; }
    if(!confirm(k==="morning" ? `Send today's Daily Fire (day ${adm.day}) to everyone now?` : "Send the evening reminder now to everyone who hasn't filled today's card?")) return;
    try{ const d = await callFn({pin:admPin, action:"auto", kind:k});
      autoNote = d.skipped ? `Nothing sent (${d.skipped.replace(/_/g," ")}).` : `✓ Sending to ${d.total} ${d.total===1?"person":"people"}.`;
      await loadMessages(); }
    catch(e){ autoNote = ERR_WA[e.message] || ("Could not send: " + e.message); adminRender(); }
  });

  const wc = $("#waChange"); if(wc) wc.onclick = () => { showWaSetup = true; adminRender(); };
  const ws = $("#waSave");
  if(ws) ws.onclick = async () => {
    const i = $("#waInst").value.trim(), tk = $("#waTok").value.trim();
    if(!i || !tk){ alert("Enter both the instance ID and the access token."); return; }
    try{ await rpc("gd_admin_set_whatsapp", {p_pin:admPin, p_instance:i, p_token:tk}); showWaSetup = false; await loadMessages(); }
    catch(e){ alert("Could not save: " + e.message); }
  };
  const a = $("#mAud");
  if(a) a.onchange = () => { keep(); const [t, ...v] = a.value.split(":"); comp.aud = t; comp.val = v.join(":"); adminRender(); };
  const tl = $("#mTestLang"); if(tl) tl.onchange = keep;
  const f = $("#mFile");
  if(f) f.onchange = async () => {
    keep(); const file = f.files[0]; if(!file) return;
    if(file.size > 50*1024*1024){ comp.note = "File is over 50 MB. Compress it first."; adminRender(); return; }
    comp.note = "Uploading " + file.name + "…"; comp.busy = true; adminRender();
    try{ const fd = new FormData(); fd.append("pin", admPin); fd.append("file", file);
      comp.media = await callFn(fd, true); comp.note = "";
    }catch(e){ comp.note = "Upload failed: " + (ERR_WA[e.message] || e.message); }
    comp.busy = false; adminRender();
  };
  const rm = $("#mRemove"); if(rm) rm.onclick = () => { keep(); comp.media = null; adminRender(); };
  document.querySelectorAll("[data-errs]").forEach(b => b.onclick = () => {
    const m = admMsg.messages.find(x => String(x.id) === b.dataset.errs);
    alert((m.errors||[]).map(x => `${x.name} (+${x.phone}): ${x.detail}`).join("\n\n") || "No details.");
  });
  const s = $("#mSend");
  if(s) s.onclick = async () => {
    keep();
    const n = audienceCount();
    if(!comp.en.trim() && !comp.fr.trim() && !comp.media){ comp.note = ERR_WA.empty_message; adminRender(); return; }
    if(comp.aud !== "test" && !confirm(`Send this WhatsApp message to ${n} ${n===1?"person":"people"}?`)) return;
    comp.busy = true; comp.note = ""; adminRender();
    try{
      const audience = comp.aud === "test" ? {type:"test", value:comp.testNum, lang:comp.testLang} : {type:comp.aud, value:comp.val || null};
      const d = await callFn({pin:admPin, audience, text_en:comp.en, text_fr:comp.fr, media_url:comp.media?.url, media_name:comp.media?.name});
      comp.note = `✓ Sending to ${d.total} ${d.total===1?"person":"people"}. Progress shows below.`;
      if(comp.aud !== "test"){ comp.en = ""; comp.fr = ""; comp.media = null; }
    }catch(e){ comp.note = ERR_WA[e.message] || ("Could not send: " + e.message); }
    comp.busy = false; await loadMessages(); adminRender();
  };
}


/* ---------- growth guide view ---------- */
let gview = null;
function guideLogin(msg){
  document.body.classList.add("admin");
  root.innerHTML = `<div class="wrap stack-lg" style="max-width:440px"><div class="brand"><img src="${LOGO}" alt="">Growth Day · Growth Guide</div>
    <div class="stack">${phoneField("237","")}<div><label for="gp">PIN</label><input id="gp" class="pin" type="password" inputmode="numeric" maxlength="4"></div>
    <p class="err" role="alert">${msg?esc(msg):""}</p><button class="btn btn-primary" id="gl">Open my triad</button></div></div>`;
  const go = async () => { try{ const tok = await rpc("gd_guide_login",{p_phone:fullPhone($("#code").value,$("#phone").value), p_pin:$("#gp").value.trim()}); store.set("gd_guide", tok); guideLoad(); }
    catch(e){ guideLogin(e.message==="wrong_pin"?"Wrong PIN.":e.message==="not_found"?"This number is not registered as a guide.":e.message==="locked"?"Locked for 15 minutes.":"Could not sign in: "+e.message); } };
  $("#gl").onclick = go; $("#gp").onkeydown = e => { if(e.key==="Enter") go(); };
}
async function guideLoad(){
  const tok = store.get("gd_guide"); if(!tok) return guideLogin();
  try{ gview = await rpc("gd_guide_view",{p_token:tok}); guideRender(); }
  catch(e){ store.del("gd_guide"); guideLogin(); }
}
function guideRender(){
  const G = gview, cur = G.day;
  const stat = p => { const set = new Set(p.days); let s=0, d = set.has(cur)?cur:cur-1; while(d>=1 && set.has(d)){ s++; d--; } return {streak:s, slipping: cur>=2 && (!p.last_day || p.last_day < cur-1)}; };
  root.innerHTML = `<div class="wrap stack-lg" style="max-width:820px">
    <div class="top"><div class="brand"><img src="${LOGO}" alt="">Growth Guide · ${esc(G.triad)}</div><button class="link" id="gout">Sign out</button></div>
    <h1>Hello ${esc(firstName(G.name))}</h1>
    <p class="muted">${cur<1?`The cohort starts in ${1-cur} days.`:cur>42?"The cohort is finished.":`Day ${cur} of 42 · Week ${Math.ceil(cur/7)}.`} Red edge = no card yesterday or today: a good person to call.</p>
    ${G.members.length ? G.members.map(p => { const st = stat(p), last = p.scores[p.scores.length-1];
      const first = firstName(p.name), msg = p.lang==="fr" ? `Bonjour ${first}, c'est ${firstName(G.name)}, votre Growth Guide. Comment avance votre 1 % ?` : `Hi ${first}, it's ${firstName(G.name)}, your Growth Guide. How is your 1% going?`;
      return `<section class="panel stack ${st.slipping?"slip-card":""}">
        <div class="person"><div><h2>${esc(p.name)}</h2><p class="muted small">${AREA_ICON[p.area1-1]} ${AREA_SHORT[p.area1-1]} · ${AREA_ICON[p.area2-1]} ${AREA_SHORT[p.area2-1]} · streak ${st.streak} · ${p.days.length} cards${last?` · W${last.week}: ${last.score1}/${last.score2}`:""}</p></div>
          <a class="btn btn-primary sm" href="https://wa.me/${esc(p.phone)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">WhatsApp</a></div>
        <div class="grid2">${[[1,p.area1],[2,p.area2]].map(([k,a])=>{ const pl=(p.plan||{})[k]||{};
          return `<div class="small"><b>${AREA_ICON[a-1]} Plan</b>${[["honest","Where I am"],["target","6-week target"],["daily","Daily 1%"],["excuse","Excuse"],["answer","Answer"]].map(([f,lb])=>`<p><span class="muted">${lb}:</span> ${pl[f]?esc(pl[f]):'<span class="muted">–</span>'}</p>`).join("")}</div>`; }).join("")}</div>
${(()=>{ const pl=p.plan||{}, bk=pl.books||[], cr=pl.courses||[]; if(!bk.length && !cr.length) return "";
            return `<div class="grid2" style="margin-top:14px"><div><h3>📚 Reading</h3>${bk.map(b=>`<p class="small">${esc(b.title)}${b.author?` <span class="muted">· ${esc(b.author)}</span>`:""} · <b>${b.progress>=100?"finished":b.progress+"%"}</b></p>`).join("")||'<p class="small muted">–</p>'}</div>
              <div><h3>🎓 Courses & activities</h3>${cr.map(c=>`<p class="small">${esc(c.title)}${c.provider?` <span class="muted">· ${esc(c.provider)}</span>`:""} · <b>${c.progress>=100?"done":c.progress+"%"}</b></p>`).join("")||'<p class="small muted">–</p>'}</div></div>`; })()}
        ${(p.notes||[]).length ? `<div class="small"><b>Latest answers</b>${p.notes.map(n=>`<p><span class="muted">Day ${n.day}:</span> ${n.note1?esc(n.note1):""}${n.note2?` · ${esc(n.note2)}`:""}</p>`).join("")}</div>` : ""}
        ${last && last.reflection ? `<p class="small"><b>Week ${last.week} reflection:</b> ${esc(last.reflection)}</p>` : ""}
      </section>`; }).join("") : `<p class="muted">No one is in ${esc(G.triad)} yet. The admin assigns triads on the People page.</p>`}
  </div>`;
  $("#gout").onclick = () => { store.del("gd_guide"); guideLogin(); };
}

/* ---------- start ---------- */
document.documentElement.lang = lang;
const route = () => { if(location.hash === "#admin") adminLogin(); else if(location.hash === "#guide") guideLoad(); else { document.body.classList.remove("admin"); boot(); } };
route();
window.addEventListener("hashchange", route);
</script>
</body>
