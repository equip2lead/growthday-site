<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Growth Day Cohort</title>
<meta name="theme-color" content="#1C2340">
<meta name="description" content="Grow 1% a day for 42 days. The 6-week Growth Day cohort, led by Dr. Denis Ekobena (Equip2Lead). In English and French.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://growthday.cc/cohort/">
<meta property="og:title" content="Grow 1% a day for 42 days · Growth Day Cohort">
<meta property="og:description" content="A 6-week cohort: the Daily Fire at 6:00, your 1% Card each night, a triad that keeps you going. English & français.">
<meta property="og:image" content="https://growthday.cc/cohort/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://growthday.cc/cohort/og-image.jpg">

<link rel="icon" href="https://growthday.cc/growing-flame.png">
<link rel="apple-touch-icon" href="/cohort/icon-180.png">
<link rel="manifest" href="/cohort/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Growth Day">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C2340; --text:#1C2340; --muted:#5B6480; --bg:#F3F6FB; --surface:#FFFFFF;
  --line:#D6DDEA; --ember:#E8890C; --glow:#FFC94D; --leaf:#2F855A; --danger:#B42318;
  --ember-text:#A35F00;
  --display:"Sora", "Segoe UI", system-ui, sans-serif;
  --body:"Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --text:#EEF1F8; --muted:#A3ACC4; --bg:#121729; --surface:#1C2340; --line:#2E3758; --ember-text:#FFB547; }
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:400 17px/1.55 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding:20px 18px 110px}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0}
h1{font-size:30px;font-weight:700;letter-spacing:-.01em}
h2{font-size:22px;font-weight:600}
h3{font-size:17px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:15px}
.stack>*+*{margin-top:14px}
.stack-lg>*+*{margin-top:26px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:16px}
.brand img{width:34px;height:34px;object-fit:contain}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langs button{border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:6px 12px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:#fff}
@media (prefers-color-scheme: dark){.langs button[aria-pressed="true"]{background:var(--ember);color:#1C2340}}
label{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
input,textarea,select{width:100%;font:400 17px var(--body);color:var(--text);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ember)}
:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.hint{font-size:14px;color:var(--muted);margin-top:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;padding:15px 18px;font:600 17px var(--display);cursor:pointer;text-decoration:none}
.btn-primary{background:var(--ember);color:#1C2340}
.btn-dark{background:var(--ink);color:#fff}
@media (prefers-color-scheme: dark){.btn-dark{background:#2E3758}}
.btn-ghost{background:none;color:var(--text);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.55;cursor:default}
.link{background:none;border:0;padding:0;color:var(--ember-text);font:600 16px var(--body);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.err{color:var(--danger);font-weight:600;font-size:15px}
@media (prefers-color-scheme: dark){.err{color:#FF8A80}}
.ok{color:var(--leaf);font-weight:600}
@media (prefers-color-scheme: dark){.ok{color:#68D391}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.chips{display:grid;grid-template-columns:1fr;gap:8px}
.chip{text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:11px 14px;font:400 15px/1.35 var(--body);cursor:pointer}
.chip b{display:block;font-family:var(--display);font-weight:600;font-size:15.5px}
.chip[aria-pressed="true"]{border-color:var(--ember);box-shadow:inset 0 0 0 1.5px var(--ember)}
.chip[aria-pressed="true"] b::after{content:" ✓";color:var(--ember-text)}
.chip:disabled{opacity:.45}

.credit{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);text-align:center}
.credit b{font-weight:600;color:var(--text)}


/* ---------- landing ---------- */
.land{--max:1120px}
.lh{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.lh-in{position:relative;min-height:100svh;display:flex;flex-direction:column;max-width:var(--max);margin:0 auto}
.lh-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--ink)}
.lh-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,35,64,.85) 0%,rgba(28,35,64,.15) 22%,rgba(28,35,64,.82) 58%,#1C2340 100%)}
.lnav{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:18px 20px}
.lnav .brand{color:#fff}
.lnav-r{display:flex;gap:16px;align-items:center}
.lt{color:#fff}
.lh .langs{border-color:rgba(255,255,255,.35)}
.lh .langs button{color:rgba(255,255,255,.85)}
.lh .langs button[aria-pressed="true"]{background:#fff;color:#1C2340}
.lh-copy{position:relative;z-index:2;margin-top:auto;padding:0 20px 36px;max-width:640px}
.pill{display:inline-block;background:var(--ember);color:#1C2340;font-weight:600;border-radius:999px;padding:6px 14px;font-size:15px}
.lh-title{font-size:clamp(46px,11.5vw,88px);line-height:.98;letter-spacing:-.03em;margin:18px 0 16px;font-weight:700}
.lh-sub{font-size:18px;opacity:.9;max-width:32em}
.lh-cta{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.btn-glass{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lh-proof{margin-top:16px;font-size:15px;opacity:.78}
@media (min-width:900px){
  .lh{background:radial-gradient(760px 520px at 78% 45%,rgba(232,137,12,.25),transparent 62%),var(--ink)}
  .lh-in{display:grid;grid-template-columns:1.15fr .85fr;grid-template-rows:auto 1fr;min-height:auto;padding-bottom:72px;column-gap:56px}
  .lnav{grid-column:1/-1;grid-row:1}
  .lh-copy{grid-column:1;grid-row:2;align-self:center;margin:0;padding:24px 20px}
  .lh-video{position:relative;inset:auto;grid-column:2;grid-row:2;height:min(76vh,700px);width:auto;aspect-ratio:9/16;justify-self:center;border-radius:36px;border:8px solid #0E1328;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08)}
  .lh-shade{display:none}
  .lh-cta{flex-direction:row}
  .lh-cta .btn{width:auto}
}
.ls{padding:76px 20px}
.lin{max-width:var(--max);margin:0 auto}
.lin.two{display:grid;gap:40px}
@media (min-width:900px){.lin.two{grid-template-columns:1fr 1fr;align-items:center;gap:72px}}
.ls h2{font-size:clamp(32px,5.4vw,50px);letter-spacing:-.025em;font-weight:700;margin-bottom:14px}
.lead{font-size:19px;color:var(--muted);max-width:32em}
.ls-alt{background:var(--surface)}
.ls-dark{background:var(--ink);color:#fff}
.ls-dark .lead{color:rgba(255,255,255,.78)}
.cnum{font-family:var(--display);font-size:clamp(84px,16vw,140px);font-weight:700;line-height:1;color:var(--ember-text);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 14px;margin-top:22px}
.bar-l{grid-column:1/-1;font-weight:600;font-size:15px}
.track{height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.fill{display:block;height:100%;width:0;border-radius:99px;transition:width 1.4s cubic-bezier(.2,.7,.2,1)}
.on .fill{width:var(--w)}
.fill.up{background:var(--ember)}
.fill.down{background:var(--muted)}
.bar b{font-family:var(--display);font-size:18px}
.rhythm{list-style:none;padding:0;margin:26px 0 0}
.rhythm li{display:grid;grid-template-columns:88px 1fr;gap:2px 16px;padding:16px 0;border-top:1px solid var(--line)}
.rhythm time{font-family:var(--display);font-weight:700;color:var(--ember-text);grid-row:span 2}
.rhythm h3{font-size:18px}
.rhythm p{color:var(--muted)}
.more{margin-top:18px;color:var(--muted)}
.demo{background:var(--ink);border-radius:26px;padding:24px;color:#fff;max-width:440px;width:100%;justify-self:center}
.demo .flames .h,.demo .flames .w{color:rgba(255,255,255,.55)}
.demo .f-miss path,.demo .f-future path{stroke:rgba(255,255,255,.3)}
.demo .fl{cursor:default}
.demo-cap{margin-top:16px;opacity:.82;font-size:15px}
.arc{list-style:none;padding:0;margin:30px 0 0;display:grid;gap:12px}
@media (min-width:700px){.arc{grid-template-columns:repeat(3,1fr)}}
.arc li{border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:20px}
.arc .wk{font-size:14px;opacity:.6;font-weight:600}
.arc h3{font-size:24px;margin:4px 0 6px;color:var(--glow)}
.arc p{opacity:.84}
.lchips{display:grid;grid-template-columns:1fr;gap:10px;margin:26px 0 20px}
@media (min-width:700px){.lchips{grid-template-columns:repeat(3,1fr)}}
.lgo{max-width:340px}
.leader{display:grid;gap:30px;align-items:center}
@media (min-width:800px){.leader{grid-template-columns:300px 1fr;gap:56px}}
.portrait{aspect-ratio:4/5;border-radius:26px;background:var(--ink);display:grid;place-items:center;overflow:hidden;color:var(--glow);font-family:var(--display);font-size:76px;font-weight:700;max-width:300px;width:100%}
.portrait img{width:100%;height:100%;object-fit:cover}
.faq{margin-top:20px}
.faq details{border-top:1px solid var(--line);padding:18px 0}
.faq summary{font-family:var(--display);font-weight:600;font-size:18px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--ember-text);font-size:24px;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq details p{margin-top:8px;color:var(--muted);max-width:40em}
.final .btn{margin-top:26px;max-width:340px}
.land .credit{margin:0;padding:28px 20px 44px;background:var(--ink);color:rgba(255,255,255,.62);border-top:1px solid rgba(255,255,255,.1)}
.land .credit b{color:#fff}

.watch{display:inline-block;margin-top:14px;font-size:16px}
.recap{border:0;padding:0;background:transparent;max-width:min(92vw,420px);width:100%}
.recap::backdrop{background:rgba(10,14,30,.88)}
.recap video{width:100%;max-height:86vh;border-radius:20px;display:block;background:#000}
.recap-x{position:absolute;top:8px;right:8px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:24px;cursor:pointer}
.auto-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-top:1px solid var(--line);padding-top:14px}
.switch{flex:none;width:52px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer}
.switch span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.switch[aria-pressed="true"]{background:var(--leaf)}
.switch[aria-pressed="true"] span{left:25px}
.preview{border-top:1px solid var(--line);padding-top:14px}
pre.wa{white-space:pre-wrap;word-wrap:break-word;font:400 15px/1.45 var(--body);background:#DCF8C6;color:#111;border-radius:12px;padding:12px 14px;margin:0}

/* ---------- signup ---------- */
.is-auth{background:var(--bg)}
.auth{max-width:520px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column}
.auth-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--bg)}
.auth-top .langs{margin-left:auto}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font-size:20px;cursor:pointer;flex:none}
.steps{display:flex;gap:6px;flex:1;max-width:180px}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--ember)}
.auth-body{padding:8px 20px 150px;flex:1}
.auth-body h1{font-size:clamp(30px,8vw,40px);letter-spacing:-.02em;margin:6px 0 10px}
.step-lbl{font-weight:600;color:var(--ember-text);font-size:15px}
.auth-cta{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,var(--bg) 26%)}
.auth-cta>*{max-width:480px;margin-left:auto;margin-right:auto}
.auth-cta .err{min-height:0;margin-bottom:8px}
.auth-cta .err:empty{display:none}
.phone-row{display:grid;grid-template-columns:116px 1fr;gap:8px}
.phone-row select{padding:12px 8px}
.tiles9{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.atile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:16px;padding:14px 12px;cursor:pointer;font:400 13.5px/1.35 var(--body);position:relative}
.atile b{font-family:var(--display);font-size:15px;font-weight:600;line-height:1.25}
.atile span:last-child{color:var(--muted)}
.atile .ai{font-size:26px;line-height:1}
.atile[aria-pressed="true"]{border-color:var(--ember);box-shadow:inset 0 0 0 1.5px var(--ember);background:color-mix(in srgb,var(--ember) 8%,var(--surface))}
.atile[aria-pressed="true"]::after{content:"✓";position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--ember);color:#1C2340;font-weight:700;font-size:13px;display:grid;place-items:center}
.atile:disabled{opacity:.45;cursor:default}
.pin-wrap{display:flex;align-items:center;gap:14px;margin-top:22px}
.pin{font-family:var(--display);font-size:34px;letter-spacing:.6em;text-align:center;padding:12px 0 12px .6em;max-width:220px}
.summary{margin-top:28px;border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--surface)}
.mini-areas{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mini-areas span{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:600}
.done .auth-body{padding-top:56px;text-align:left}
.big-flame{width:96px;height:96px;margin-bottom:18px}
.big-flame svg{width:100%;height:100%}
.big-flame path{fill:var(--ember);stroke:var(--ember);transform-origin:50% 75%}
@media (prefers-reduced-motion:no-preference){.big-flame path{animation:ignite .9s cubic-bezier(.2,.8,.2,1.3)}}
.lead-s{font-size:18px;color:var(--muted)}
.tip{margin-top:28px}
.tip h3{margin-bottom:4px}

/* ---------- dashboard ---------- */
.app-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hello{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1}
.app-top-r{display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:50%;border:0;background:var(--ink);color:var(--glow);font:700 15px var(--display);cursor:pointer}
@media (prefers-color-scheme: dark){.avatar{background:#2E3758}}
.hero2{background:var(--ink);color:#fff;border-radius:24px;padding:22px;display:flex;align-items:center;gap:20px}
.hero2-col{flex-direction:column;align-items:stretch}
.hero2-row{display:flex;align-items:center;gap:20px}
.hero2-t p{opacity:.8}
.hero2-t h2{font-size:21px;margin-top:4px;line-height:1.25}
.hero2-t .streak{margin-top:8px}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring-bg{stroke:rgba(255,255,255,.14)}
.ring-fg{stroke:var(--ember);stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.ring-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-t b{font-family:var(--display);font-size:32px;line-height:1}
.ring-t span{font-size:12px;opacity:.75;max-width:70px;line-height:1.2;margin-top:2px}
.wlbl{font-size:13px;font-weight:600;opacity:.6;margin-bottom:6px}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px}
.wd.is-today{background:rgba(255,255,255,.08)}
.wd .fl{width:30px;height:30px;cursor:default}
.wd small{font-size:12px;opacity:.65}
.hero2 .f-miss path,.hero2 .f-future path{stroke:rgba(255,255,255,.3)}
.sec{font-size:20px}
.mine{display:grid;gap:10px}
.mine-a{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.mine-a .ai,.ctile .ai{font-size:28px;line-height:1}
.next{list-style:none;padding:0;margin:0;border-left:2px solid var(--line);margin-left:6px}
.next li{position:relative;padding:0 0 16px 20px;display:flex;flex-direction:column}
.next li::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--ember)}
.next li span{color:var(--muted)}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:118px;text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--text);border-radius:18px;padding:14px;cursor:pointer;font:600 15px/1.3 var(--display)}
.ctile .tick{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-size:15px;transition:all .15s}
.ctile[aria-pressed="true"]{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 10%,var(--surface))}
.ctile[aria-pressed="true"] .tick{background:var(--leaf);border-color:var(--leaf);color:#fff}
.notes summary{cursor:pointer;color:var(--ember-text);font-weight:600;font-size:15px}

.admin .wrap{max-width:1180px}
.wk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.wk-col{display:flex;flex-direction:column;gap:6px}
.wk-col h3{font-size:15px;margin-bottom:2px}
.dcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:8px 10px;cursor:pointer;font:400 14px/1.3 var(--body)}
.dcard b{font-family:var(--display);font-weight:600;font-size:14px}
.dcard .dnum{font-size:12px;color:var(--muted)}
.dcard .dbadges{font-size:12px;color:var(--leaf)}
.dcard.empty{border-style:dashed;opacity:.7}
.dcard.empty b{color:var(--muted);font-weight:500}
.dcard.sel{border-color:var(--ember);box-shadow:inset 0 0 0 1.5px var(--ember);opacity:1}
.hw{background:color-mix(in srgb,var(--ember) 9%,var(--surface));border-radius:14px;padding:12px 14px}
.hw-l{font-size:13px;font-weight:600;color:var(--ember-text)}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}

/* pricing cards */
.pricing{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;align-items:stretch}
.pcard{position:relative;display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:22px 20px 20px;box-shadow:var(--shadow)}
.pcard.best{border-color:var(--ember);box-shadow:0 10px 30px color-mix(in srgb,var(--ember) 22%,transparent)}
.pc-flag{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--ember);color:#1C2340;font:700 12px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:5px 14px;border-radius:99px;white-space:nowrap}
.pcard h3{font:700 19px var(--display);text-align:center}
.pc-price{text-align:center;margin-top:10px}
.pc-price b{display:block;font:800 44px/1 var(--display);letter-spacing:-.03em}
.pc-price span{display:block;color:var(--muted);font-weight:600;font-size:13.5px;margin-top:6px}
.pc-sub{text-align:center;font-weight:600;font-size:14px;color:var(--muted);margin-top:6px;min-height:20px}
.pc-sub.save{color:#0B6B3A}
.pc-feat{list-style:none;padding:0;margin:16px 0 18px;display:flex;flex-direction:column;gap:9px;flex:1}
.pc-feat li{position:relative;padding-left:26px;font-size:14.5px;line-height:1.4}
.pc-feat li::before{content:"✓";position:absolute;left:0;top:0;width:18px;height:18px;border-radius:50%;background:#DDF5E7;color:#0B6B3A;font-weight:800;font-size:11px;display:grid;place-items:center}
@media (prefers-color-scheme: dark){.pc-feat li::before{background:#123A27;color:#7CE3A7}.pc-sub.save{color:#7CE3A7}}
/* payment method sheet */
#msheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.ms-back{position:absolute;inset:0;background:rgba(14,18,34,.5)}
.ms-card{position:relative;width:100%;max-width:480px;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .26s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){#msheet{align-items:center}.ms-card{border-radius:24px}}
.ms-head{display:flex;justify-content:space-between;align-items:center}
.ms-sum{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.ms-sum span{color:var(--muted);font-weight:600;font-size:14px}
.ms-sum b{font:700 24px var(--display)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
body.no-scroll{overflow:hidden}
/* onboarding slides */
.ob .auth-top{gap:12px}
.ob .steps{flex:1}
.ob-body{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:6vh}
.ob-ic{font-size:64px;width:120px;height:120px;border-radius:36px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;margin-bottom:8px}
.ob-body .dvideo-wrap,.ob-body .vid-ph{width:100%;margin-bottom:8px}
.plan-areas{display:flex;flex-direction:column;gap:18px}
/* sidebar: hidden on phones */
.sidebar{display:none}
.avatar.sm{width:36px;height:36px;font-size:13px;display:grid;place-items:center;flex:none}
@media (min-width:1100px){
  .tabs{display:none}
  .sidebar{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:248px;padding:26px 16px 20px;background:var(--surface);border-right:1px solid var(--line);z-index:20}
  .sb-brand{display:flex;align-items:center;gap:10px;font:700 20px var(--display);padding:0 10px 26px}
  .sb-brand img{width:34px;height:34px;object-fit:contain}
  .sb-nav{display:flex;flex-direction:column;gap:4px}
  .sb-nav button{display:flex;align-items:center;gap:14px;border:0;background:none;color:var(--text);font:600 16px var(--body);padding:12px 12px;border-radius:14px;cursor:pointer;text-align:left}
  .sb-nav button svg{width:24px;height:24px}
  .sb-nav button:hover{background:var(--fill)}
  .sb-nav button[aria-current="page"]{background:color-mix(in srgb,var(--ember) 14%,transparent);color:var(--ember-text,#A35F00)}
  .sb-emoji{width:24px;text-align:center;font-size:19px}
  .sb-foot{margin-top:auto;display:flex;flex-direction:column;gap:16px;padding:0 6px}
  .sb-user{display:flex;align-items:center;gap:10px}
  .sb-user div{display:flex;flex-direction:column;align-items:flex-start}
  .shell .wrap{margin-left:248px;max-width:none;padding:26px 44px 60px}
  .shell .app-top{position:static;margin:0 0 6px;max-width:1120px;background:none;backdrop-filter:none;-webkit-backdrop-filter:none}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start;max-width:1120px}
  .col-rail{position:sticky;top:24px}
  .col-rail:empty{display:none}
  .cols:has(.col-rail:empty){grid-template-columns:minmax(0,760px)}
  .plan-areas{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  .tab-me .col-main{display:block;columns:2;column-gap:22px}
  .tab-me .col-main>*{break-inside:avoid;margin-bottom:22px;display:block}
  .shell .credit{max-width:1120px}
}
@media (min-width:700px) and (max-width:1099px){
  .shell .wrap{max-width:720px}
  .plan-areas{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
}
/* onboarding sample screens */
.mock{width:100%;max-width:340px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow-lg);padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;margin:4px auto 10px}
.mock.wa{background:#ECE5DD}
.wa-head{display:flex;align-items:center;gap:8px;color:#075E54;font-size:15px}.wa-head .wa-ic{color:#25D366;width:20px;height:20px}
.wa-bub{position:relative;background:#fff;color:#111;border-radius:12px 12px 12px 4px;padding:10px 12px 18px;font-size:14px;line-height:1.45;max-width:92%}
.wa-bub.audio{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.wa-bub .pl{width:30px;height:30px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.wa-bub .wave{flex:1;height:18px;background:repeating-linear-gradient(90deg,#9AA3B8 0 3px,transparent 3px 6px);border-radius:3px;opacity:.7}
.wa-t{position:absolute;right:10px;bottom:4px;font-size:11px;color:#7a7a7a}
.wa-bub.audio .wa-t{position:static}
.mk-l{font:700 14px var(--display);color:var(--muted)}
.mk-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mk-tile{position:relative;border:2px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;font-size:22px}
.mk-tile b{font-size:13.5px}
.mk-tile.on{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 8%,var(--surface))}
.mk-tile i{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--leaf);color:#fff;font-size:11px;font-style:normal;display:grid;place-items:center}
.mk-note{border:1.5px solid var(--ember);border-radius:12px;padding:10px;font-size:14px}
.mk-flames{font-size:18px}.mk-flames span{font-size:13px;font-weight:700;color:var(--ember-text,#A35F00)}
.mk-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;background:var(--fill);border-radius:12px;padding:10px 12px}
.mk-q{font-size:14px;line-height:1.4}.mk-q small{display:block;font-size:11.5px;font-weight:700;color:var(--ember-text,#A35F00);text-transform:uppercase;letter-spacing:.05em}
.mk-chips,.ps-chips{display:flex;flex-wrap:wrap;gap:6px}.mk-chips span,.ps-chips span{background:var(--fill);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600}
.mk-book{display:flex;gap:12px;align-items:center}
.mk-book .cv,.de-book .cv{flex:none;width:46px;height:64px;border-radius:3px 7px 7px 3px;color:#fff;font:600 8.5px/1.15 var(--display);padding:6px 5px;display:flex;align-items:flex-end;box-shadow:inset 4px 0 0 rgba(0,0,0,.18)}
.mk-book>div{flex:1;display:flex;flex-direction:column;gap:2px;font-size:14px}.mk-book small{color:var(--muted);font-size:12px}
.mk-book .pbar{margin-top:4px}
.mk-seg button{height:30px;font-size:12px;pointer-events:none}
.mk-sem{display:flex;gap:12px;align-items:center}.mk-sem small{display:block;color:var(--muted);font-size:12.5px}.mk-sem b{font-size:15px}
.mk-tg{display:flex;gap:10px;align-items:center;background:var(--fill);border-radius:14px;padding:10px}.mk-tg .tg{width:36px;height:36px}.mk-tg small{display:block;color:var(--muted);font-size:12.5px}
.mk-person{display:flex;align-items:center;gap:10px}.mk-person>div{flex:1}.mk-person small{display:block;color:var(--muted);font-size:12.5px}
.mk-btn{font-size:12px;font-weight:700;border:1.5px solid var(--field-line);border-radius:99px;padding:4px 10px}
.ob-body h1{margin-top:8px}
/* survey */
.sv-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:10px 0}
.sv-hero>span{font-size:56px}
.sv-list{text-align:left;align-self:stretch;background:var(--surface);border-radius:18px;padding:14px 14px 14px 36px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;font-weight:600}
.sv-steps{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.sv-steps i{height:5px;border-radius:99px;background:var(--line)}.sv-steps i.on{background:var(--ember)}
.sv-q{background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.sc-seg.seg5{grid-template-columns:repeat(5,1fr)}
.sv-area .plan-h h3{font:700 18px var(--display)}
.sv-lead{font:600 17px/1.4 var(--display)}
.sv-cta{text-align:center;align-items:center}.sv-cta-ic{font-size:48px}
/* plan summary */
.ps-why{background:linear-gradient(135deg,#1C2340,#2C3566);color:#fff}
.ps-why small{color:var(--glow);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.ps-why p{font:600 18px/1.45 var(--display);margin-top:6px}
.ps-score{margin-left:auto;font:700 12.5px var(--body);background:var(--fill);border-radius:99px;padding:4px 10px}
.plan-h{display:flex;align-items:center;gap:10px}
.ps-row small,.ps-daily small{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ps-row p{margin-top:2px}
.ps-daily{background:color-mix(in srgb,var(--ember) 10%,var(--surface));border-radius:14px;padding:12px}
.ps-daily small{color:var(--ember-text,#A35F00)}.ps-daily p{font-weight:700;margin-top:2px}
.ps-obst{border-left:3px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:8px}
.de-shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.de-book{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.de-book .cv{width:64px;height:88px;font-size:10px}
.acc-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.col-rail{display:flex;flex-direction:column}
.lock-preview{position:relative;border-radius:22px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);cursor:pointer}
.lp-blur{padding:22px;filter:blur(5px);opacity:.55;user-select:none;display:flex;flex-direction:column;gap:10px;color:var(--muted)}
.lp-over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:color-mix(in srgb,var(--surface) 35%,transparent);padding:16px}
.lp-over>span{font-size:34px}.lp-over b{font:700 17px var(--display)}
.lock-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;cursor:pointer;color:var(--text);font:inherit}
.lk-ic{flex:none;width:46px;height:46px;border-radius:14px;background:var(--fill);display:grid;place-items:center;font-size:22px;filter:grayscale(.4)}
.lk-t{flex:1;display:flex;flex-direction:column}.lk-t small{color:var(--muted);font-size:13px}
.lk-btn{flex:none;font:700 13px var(--body);color:var(--ember-text,#A35F00);background:color-mix(in srgb,var(--ember) 12%,transparent);border-radius:99px;padding:7px 12px}
#paywall{position:fixed;inset:0;z-index:58;display:flex;align-items:flex-end;justify-content:center}
.pw-card{position:relative;width:100%;max-width:640px;max-height:92svh;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;animation:up .26s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){#paywall{align-items:center}.pw-card{border-radius:24px}}
.pw-card .pricing{margin-top:8px}
.terms h2{font:700 18px var(--display)}
.terms p{line-height:1.6}
.credit a{display:inline-block;margin-top:6px}
.faq a{color:var(--ember-text,#A35F00);font-weight:600}
.table-wrap{overflow-x:auto}
/* hero */
.hero{background:var(--ink);color:#fff;border-radius:20px;padding:26px 22px;position:relative;overflow:hidden}
.hero .big{font-family:var(--display);font-size:44px;font-weight:700;line-height:1}
.hero .big span{font-size:20px;font-weight:500;opacity:.7}
.hero p{opacity:.85}
.hero .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:10px}
.streak{display:inline-flex;align-items:center;gap:6px;background:rgba(255,201,77,.15);color:var(--glow);border-radius:999px;padding:5px 12px;font-weight:600;font-size:15px;white-space:nowrap}

/* flames */
.flames{display:grid;grid-template-columns:28px repeat(7,1fr);gap:6px;align-items:center}
.flames .h{font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.flames .w{font-size:12px;color:var(--muted);font-weight:600}
.fl{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;background:none;border:0;padding:0;cursor:pointer;color:inherit}
.fl svg{width:78%;height:78%}
.fl.today{box-shadow:inset 0 0 0 2px var(--ember)}
.fl[disabled]{cursor:default}
.f-both path{fill:var(--ember);stroke:var(--ember)}
.f-one path{fill:var(--glow);stroke:var(--ember)}
.f-miss path{fill:none;stroke:var(--line)}
.f-future path{fill:none;stroke:var(--line);opacity:.45}
.f-open path{fill:none;stroke:var(--ember)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend svg{width:16px;height:16px}
.hero .flames .h,.hero .flames .w{color:rgba(255,255,255,.6)}
.hero .f-miss path,.hero .f-future path{stroke:rgba(255,255,255,.35)}

/* lesson */
.lesson .word{font-weight:600;color:var(--ember-text)}
.lesson .principle{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.3}
.action{border-left:4px solid var(--ember);padding:4px 0 4px 14px}
.action h3{font-size:15px;color:var(--muted);font-family:var(--body)}
audio{width:100%}

/* card */
.area-check{border-top:1px solid var(--line);padding-top:14px}
.toggle{display:flex;gap:8px;margin:10px 0}
.toggle button{flex:1;border:1.5px solid var(--line);background:none;color:var(--text);border-radius:10px;padding:11px;font:600 16px var(--body);cursor:pointer}
.toggle button[aria-pressed="true"].yes{background:var(--leaf);border-color:var(--leaf);color:#fff}
.toggle button[aria-pressed="true"].no{background:var(--line);border-color:var(--line)}
.range-row{display:flex;align-items:center;gap:12px}
.range-row input{padding:0;border:0;background:none;accent-color:var(--ember)}
.range-row output{font-family:var(--display);font-weight:700;font-size:22px;min-width:30px;text-align:right}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabs div{max-width:480px;margin:0 auto;display:flex}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:12px 4px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--ember-text)}

/* admin */
.admin .wrap{max-width:1100px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-family:var(--display);font-size:28px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:13.5px;white-space:nowrap}
tr.slip td:first-child{box-shadow:inset 4px 0 0 var(--danger)}
td input{padding:6px 8px;font-size:15px;min-width:90px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 14px;font:600 14px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--ember);color:var(--ember-text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.mini{display:inline-flex;gap:2px}
.mini i{width:8px;height:14px;border-radius:2px;background:var(--line);display:inline-block}
.mini i.on{background:var(--ember)}
@media (prefers-reduced-motion:no-preference){
  .fl.lit-now path{animation:ignite .6s ease-out}
  @keyframes ignite{from{transform:scale(.6);opacity:.3}to{transform:scale(1);opacity:1}}
  .fl path{transform-origin:50% 70%}
}

/* =========================================================
   Design layer v2 · depth over borders, filled inputs, tactile controls
   ========================================================= */
:root{ --field-line:#B9C1D0; --bg:#F3F4F7; --line:#E6E8EE; --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 18px rgba(16,24,40,.06); --shadow-lg:0 10px 40px rgba(16,24,40,.12); --fill:#EEF0F4; }
@media (prefers-color-scheme: dark){ :root{ --field-line:#46507A; --bg:#0E1222; --surface:#171C31; --line:#262D4A; --fill:#1F2540; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); } }
body{font-size:16px;letter-spacing:-.006em;font-feature-settings:"cv11","ss01"}
h1,h2,h3{letter-spacing:-.022em}
.panel{border:0;border-radius:22px;box-shadow:var(--shadow);padding:20px}
.muted{color:var(--muted)}
label{font-weight:600;font-size:14px;letter-spacing:-.003em}
input,textarea,select{background:var(--surface);border:1.5px solid var(--field-line);border-radius:14px;padding:13px 15px;font-size:16px;transition:border-color .15s,background .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{background:var(--surface);border-color:var(--ember);box-shadow:0 0 0 4px color-mix(in srgb,var(--ember) 18%,transparent)}
input[type=range]{background:none}
.btn{border-radius:14px;font-family:var(--body);font-weight:600;letter-spacing:-.01em;transition:transform .12s ease,box-shadow .2s,background .2s}
.btn:active:not([disabled]){transform:scale(.98)}
.btn-primary{box-shadow:0 6px 18px color-mix(in srgb,var(--ember) 32%,transparent)}
.btn-ghost{background:var(--surface);border:0;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-lg{padding:17px 20px;font-size:17px}
.link{font-weight:600}
.chip,.atile,.ctile,.mine-a,.book,.sugb,.dcard,.stat{border-color:transparent}
.chip,.mine-a,.book,.stat{box-shadow:var(--shadow)}
.atile,.ctile{background:var(--surface);box-shadow:var(--shadow);border:2px solid transparent}
.atile[aria-pressed="true"],.ctile[aria-pressed="true"]{box-shadow:none}
.atile:active,.ctile:active,.chip:active,.plan-opt:active,.method:active{transform:scale(.985)}
.sugb{background:var(--fill)}
.hero2,.hero,.demo,.report{border-radius:26px;box-shadow:0 12px 30px rgba(28,35,64,.18)}
.sc-area,.hint-box,.pay-sum{background:var(--fill)}
/* frosted tab bar with active pill */
.tabs{background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}
.tabs button{position:relative;font-weight:600;font-size:11.5px;letter-spacing:.01em;padding-top:10px}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:6px;width:42px;height:30px;border-radius:12px;background:color-mix(in srgb,var(--ember) 14%,transparent);z-index:-1}
.tabs button svg{width:23px;height:23px}
/* sticky frosted header inside the app */
.app-top{position:sticky;top:0;z-index:5;margin:-20px -18px 0;padding:14px 18px 12px;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px)}
.hello{font-size:28px;letter-spacing:-.03em}
/* gentle entrance */
@media (prefers-reduced-motion:no-preference){
  .wrap.stack-lg > *{animation:rise .32s cubic-bezier(.2,.7,.2,1) both}
  .wrap.stack-lg > *:nth-child(2){animation-delay:.03s} .wrap.stack-lg > *:nth-child(3){animation-delay:.06s} .wrap.stack-lg > *:nth-child(4){animation-delay:.09s} .wrap.stack-lg > *:nth-child(5){animation-delay:.12s}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .pulse svg{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.9);opacity:.7}}
}
/* skeletons */
.sk{display:block;background:linear-gradient(90deg,var(--fill) 25%,color-mix(in srgb,var(--fill) 60%,var(--surface)) 37%,var(--fill) 63%);background-size:400% 100%;animation:sh 1.3s ease infinite;border-radius:8px}
.sk-row{display:flex;justify-content:space-between;align-items:center}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
/* payment sheet */
.paysheet{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.sec-l{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.plan-list{display:flex;flex-direction:column;gap:10px}
.plan-opt{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;color:var(--text);font:inherit;transition:border-color .15s,background .15s,transform .12s}
.plan-opt[aria-pressed="true"]{border-color:var(--ember);background:color-mix(in srgb,var(--ember) 6%,var(--surface))}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.plan-opt[aria-pressed="true"] .radio{border-color:var(--ember)}
.plan-opt[aria-pressed="true"] .radio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--ember)}
.po-b{display:flex;flex-direction:column;gap:3px;min-width:0}
.po-t{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.po-t b{font:600 15.5px var(--display);letter-spacing:-.01em}
.po-s{font-size:13px;color:var(--muted);line-height:1.35}
.po-p{text-align:right;white-space:nowrap}
.po-p b{display:block;font:700 20px var(--display);letter-spacing:-.02em}
.po-p small{font-size:11.5px;color:var(--muted);font-weight:600}
.badge{font:600 11.5px var(--body);color:#0B6B3A;background:#DDF5E7;border-radius:99px;padding:2px 8px}

.methods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.method{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;color:var(--text);font:inherit}
.method[aria-pressed="true"]{border-color:var(--ember);background:color-mix(in srgb,var(--ember) 6%,var(--surface))}
.method[disabled]{opacity:.5;cursor:not-allowed}
.method b{display:block;font-size:14.5px}
.method small{font-size:12px;color:var(--muted)}
.m-ic{font-size:22px}
.pay-sum{display:flex;justify-content:space-between;align-items:center;border-radius:16px;padding:14px 16px;margin-top:4px}
.pay-sum span{color:var(--muted);font-weight:600;font-size:14px}
.pay-sum b{font:700 24px var(--display);letter-spacing:-.02em}
.pay-sum b small{font-size:13px;color:var(--muted)}
.secure{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.4}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-3px}
@keyframes rot{to{transform:rotate(360deg)}}
.pay-panel{box-shadow:0 0 0 2px var(--ember),var(--shadow)}
.renew{box-shadow:0 0 0 2px var(--glow),var(--shadow)}
.center-v{text-align:center;display:flex;flex-direction:column;align-items:center;padding-top:22vh}
.acc{display:flex;gap:14px;align-items:center}
.acc-ic{font-size:26px;width:48px;height:48px;border-radius:14px;background:var(--fill);display:grid;place-items:center;flex:none}
.wkdots{display:flex;gap:6px;margin-top:8px}

.wkdots i.on{background:var(--ember);color:#1C2340}

async function rpc(fn, args){
  let res;
  try{
    res = await fetch(API + fn, {method:"POST", headers:{"Content-Type":"application/json", apikey:KEY, Authorization:"Bearer "+KEY}, body:JSON.stringify(args||{})});
  }catch(e){ throw new Error("network"); }
  const txt = await res.text();
  let data = null; try{ data = txt ? JSON.parse(txt) : null }catch(e){}
  if(!res.ok){ throw new Error((data && data.message) || "network"); }
  return data;
}
const APPFN = "https://vjnzvrhbzaqmzneirmjq.supabase.co/functions/v1/gd-app";
async function callApp(body){
  let res; try{ res = await fetch(APPFN, {method:"POST", headers:{"Content-Type":"application/json", apikey:KEY}, body:JSON.stringify(body)}); }catch(e){ throw new Error("network"); }
  const d = await res.json().catch(()=>({}));
  if(!res.ok || d.error) throw new Error(d.error || "network");
  return d;
}

function demoFlames(){
  const st = d => d>13 ? "future" : d===13 ? "open" : [4,9].includes(d) ? "one" : d===7 ? "miss" : "both";
  let h = `<div class="flames"><span></span>${t().days.map(x=>`<span class="h">${x}</span>`).join("")}`;
  for(let w=1; w<=6; w++){
    h += `<span class="w">${lang==="fr"?"S":"W"}${w}</span>`;
    for(let i=1;i<=7;i++){ const d=(w-1)*7+i; h += `<span class="fl f-${st(d)} ${d===13?"today":""}">${FLAME}</span>`; }
  }
  return h + `</div>`;
}

function joinForm(){

    cta = `<button class="btn btn-primary" id="next">${T_.join}</button>`;
  }
  root.innerHTML = authShell(inner, st, cta);
  const keep = () => { const n=$("#name"), p=$("#phone"), c=$("#code"), pn=$("#pin");
    if(n) draft.name=n.value; if(p) draft.phone=p.value; if(c) draft.code=c.value; if(pn) draft.pin=pn.value; };
  const err = m => { $("#err").textContent = m; };
  bindLang(() => { keep(); joinForm(); });
  $("#aBack").onclick = () => { keep(); if(draft.step > 1){ draft.step--; joinForm(); } else { draft.step = 1; welcome(); } window.scrollTo(0,0); };
  document.querySelectorAll("[data-area]").forEach(b => b.onclick = () => {
    const n = +b.dataset.area, y = window.scrollY;
    draft.areas = picked.includes(n) ? picked.filter(x=>x!==n) : [...picked, n].slice(0,2);
    joinForm(); window.scrollTo(0,y); const el = document.querySelector(`[data-area="${n}"]`); if(el) el.focus({preventScroll:true});
  });
  const sp = $("#showPin"); if(sp) sp.onclick = () => { const i=$("#pin"); const h = i.type==="password"; i.type = h?"text":"password"; sp.textContent = h?T_.hide:T_.show; i.focus(); };
  const pinEl = $("#pin"); if(pinEl){ pinEl.oninput = () => { pinEl.value = pinEl.value.replace(/\D/g,"").slice(0,4); }; pinEl.onkeydown = e => { if(e.key==="Enter") $("#next").click(); }; }
  $("#next").onclick = async () => {
    keep();
    if(st === 1){
      if(draft.name.trim().length < 2) return err(T_.err.name_required);
      if(fullPhone(draft.code, draft.phone).length < 8) return err(T_.err.phone_invalid);
      draft.step = 2; joinForm(); window.scrollTo(0,0); return;
    }
    if(st === 2){ if(picked.length !== 2) return err(T_.err.areas_needed); draft.step = 3; joinForm(); window.scrollTo(0,0); const p=$("#pin"); if(p) p.focus(); return; }
    if(!/^\d{4}$/.test(draft.pin)) return err(T_.err.pin_invalid);
    if(!$("#waOk").checked) return err(T_.waNeed);
    const btn = $("#next"); btn.disabled = true;
    try{
      const tok = await rpc("gd_register", {p_name:draft.name, p_phone:fullPhone(draft.code, draft.phone), p_lang:lang, p_area1:picked[0], p_area2:picked[1], p_pin:draft.pin});
      store.set("gd_token", tok); const nm = firstName(draft.name);
      callApp({action:"welcome", token:tok}).catch(()=>{});
      draft = {name:"", phone:"", code:"237", areas:[], step:1, pin:""};
      try{ me = await rpc("gd_me", {p_token: tok}); me.methods = await rpc("gd_methods", {}); }catch(e){ if(!me) me = null; }
      onboard(0, () => { if(me && me.payments_on && me.status !== "paid") payScreen(nm); else doneScreen(nm); });
    }catch(e){ btn.disabled = false;
      if(e.message === "phone_exists" || e.message === "phone_invalid"){ draft.step = 1; joinForm(); }
      err(errMsg(e)); }
  };
}

function payKinds(){
  if(me.plan_type === "full") return [];

    const title = k === "full" ? T_.pcFullT : k === "rest" ? T_.pcRestT(left) : weekly ? T_.pcNextT(wk) : T_.pcWeekT;
    const unit = k === "week" ? T_.pcUnitWeek : T_.pcUnitOnce;
    const sub = k === "week" ? (weekly ? T_.pcNextSub : T_.pcWeekSub(fcfa(me.price_week * 6))) : k === "rest" ? T_.pcRestSub(left, fcfa(me.price_week)) : (save > 0 ? T_.pcFullSub(fcfa(save)) : "");

  const sp = $("#savePlan");

      c.querySelectorAll("[data-pf]").forEach(el => { if(el.type === "range" && el.dataset.touched !== "1" && !planOf(k).score) return; o[el.dataset.pf] = el.value; }); plan[k] = o; });
    sp.disabled = true; const m = $("#planMsg");

      sp.disabled = false; m.className = "ok"; m.textContent = t().planSaved;
    }catch(e){ sp.disabled = false; m.className = "err"; m.textContent = errMsg(e); }
  };
  lastSaved = null;
  setTimeout(checkNewBadges, 400);

    <div class="ring-t"><b>${big}</b><span>${small}</span></div></div>`;
}

function collectSurvey(){
  const p = JSON.parse(JSON.stringify(me.plan || {})); p["1"] = p["1"] || {}; p["2"] = p["2"] || {}; p.survey = p.survey || {};
  const g = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
  const st = SV.step, S = p.survey;
  if(st === 1) S.stag = [0,1,2,3].map(i => +g("seg-stag"+i) || null);
  if(st === 2) S.audit = [0,1,2,3].map(i => +g("seg-audit"+i) || null);
  if(st === 3) [1,2].forEach(k => { const v = +g("seg-score"+k); if(v) p[k].score = v; p[k].honest = g("h"+k); p[k].target = g("g"+k); });
  if(st === 4) S.why = g("why");
  if(st === 5){ [1,2].forEach(k => { p[k].daily = g("d"+k); }); S.micro = [0,1,2].map(i => g("mi"+i) || ""); }
  if(st === 6) [1,2].forEach(k => { p[k].excuse = g("e"+k); p[k].answer = g("r"+k); });
  if(st === 7){ S.time = g("svt"); S.place = g("svp"); S.journal = g("svj"); S.review = g("svr"); S.partner = g("svpa"); }
  S.step = Math.max(S.step || 0, Math.min(7, st + 1)); if(st === 7) S.done = true;
  p.books = books(); p.courses = courses();
  return p;
}

const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent), standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
function b64u(s){ const p = "=".repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from([...b].map(c=>c.charCodeAt(0))); }
let ntNote = "";
function notifCard(){
  const T_ = t(), x = me.extra || {};

  else body = `<button class="btn btn-dark sm" id="ntToggle" data-on="1">🔔 ${T_.ntOn}</button>`;
  return `<section class="panel stack"><h3>🔔 ${T_.ntTitle}</h3><p class="muted small">${T_.ntSub}</p>${body}${ntNote?`<p class="small err">${esc(ntNote)}</p>`:""}</section>`;

async function togglePush(on){
  const T_ = t();
  try{
    const reg = await navigator.serviceWorker.register("/cohort/sw.js", {scope:"/cohort/"});
    await navigator.serviceWorker.ready;
    if(on){
      const perm = await Notification.requestPermission();
      if(perm !== "granted"){ ntNote = T_.ntDenied; renderApp(); return; }
      const sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u(me.extra.vapid)});
      await rpc("gd_save_push", {p_token:store.get("gd_token"), p_sub:sub.toJSON(), p_on:true});
      me.extra.push_on = true; ntNote = "";
    } else {
      const sub = await reg.pushManager.getSubscription();
      if(sub){ await rpc("gd_save_push", {p_token:store.get("gd_token"), p_sub:sub.toJSON(), p_on:false}); await sub.unsubscribe(); }
      me.extra.push_on = false;
    }
  }catch(e){ ntNote = T_.ntNo; }
  renderApp();
}

    sc.querySelectorAll("[data-sc]").forEach(b => b.onclick = () => { const [k,n] = b.dataset.sc.split(":").map(Number);
      $("#s"+k).value = n; $("#o"+k).innerHTML = `${n}<small>/10</small>`;
      b.parentElement.querySelectorAll("button").forEach(x => { const v = +x.textContent; x.classList.toggle("on", v<=n); x.setAttribute("aria-checked", v===n); });
      const d = $("#d"+k); if(d){ const st = +d.dataset.start; d.textContent = t().scSince(n-st); d.className = "chip-d " + (n-st>0?"up":n-st<0?"down":""); } });
    sc.querySelectorAll("[data-prompt]").forEach(b => b.onclick = () => { const ta = $("#refl"); ta.value = (ta.value ? ta.value.trim() + "\n" : "") + b.dataset.prompt + " "; ta.focus(); });
    $("#saveScore").onclick = async () => {
      const w = +sc.dataset.w; const btn = $("#saveScore"); btn.disabled = true;
      try{
        const a = {p_token:tok, p_week:w, p_s1:+$("#s1").value, p_s2:+$("#s2").value, p_reflection:$("#refl").value};
        await rpc("gd_score", a);
        me.scores = me.scores.filter(x=>x.week!==w).concat({week:w, score1:a.p_s1, score2:a.p_s2, reflection:a.p_reflection}).sort((x,y)=>x.week-y.week);
        renderApp(); const sc2 = $("#score"); if(sc2) sc2.scrollIntoView({block:"center"});
      }catch(e){ btn.disabled = false; const m=$("#scoreMsg"); m.className="err"; m.textContent = errMsg(e); }
    };
  }
  // me
  document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
    const n = +b.dataset.pick, p = viewMe.picked || [me.area1, me.area2];
    viewMe.picked = p.includes(n) ? p.filter(x=>x!==n) : [...p, n].slice(0,2); renderApp();
  });
  const sm = $("#saveMe");
  if(sm) sm.onclick = async () => {
    const p = viewMe.picked || [me.area1, me.area2]; const m = $("#meMsg");
    if(p.length !== 2){ m.className="err"; m.textContent = t().err.areas_needed; return; }
    sm.disabled = true;
    try{ await rpc("gd_update_profile", {p_token:tok, p_lang:lang, p_area1:p[0], p_area2:p[1]});
      me.area1 = p[0]; me.area2 = p[1]; viewMe.picked = null; renderApp();
      const m2 = $("#meMsg"); m2.className="ok"; m2.textContent = t().changesSaved;
    }catch(e){ sm.disabled = false; m.className="err"; m.textContent = errMsg(e); }
  };
  const so = $("#signOut"); if(so) so.onclick = () => { store.del("gd_token"); me = null; tab="today"; welcome(); };
}

function pStats(p){
  const cur = Math.min(adm.day, 42);
  const set = new Set(p.days); let s = 0, d = set.has(cur) ? cur : cur-1;
  while(d >= 1 && set.has(d)){ s++; d--; }
  const slipping = adm.day >= 2 && (!p.last_day || p.last_day < adm.day - 1);
  return {streak:s, total:p.days.length, slipping};
}

async function callFn(body, isForm){
  const res = await fetch(FN, {method:"POST", headers: isForm ? {apikey:KEY} : {"Content-Type":"application/json", apikey:KEY}, body: isForm ? body : JSON.stringify(body)});
  const d = await res.json().catch(() => ({}));
  if(!res.ok || d.error) throw new Error(d.error || "network");
  return d;
}
function audienceCount(){
  const P = adm.participants;
  if(comp.aud === "all") return (adm.pay.price_week>0||adm.pay.price_full>0) ? P.filter(p=>p.status==="paid").length : P.length;
  if(comp.aud === "slipping") return P.filter(p=>pStats(p).slipping).length;
  if(comp.aud === "lang") return P.filter(p=>p.lang===comp.val).length;
  if(comp.aud === "triad") return P.filter(p=>p.triad===comp.val).length;
  if(comp.aud === "test") return 1;
  if(comp.aud === "unpaid") return P.filter(p=>p.status==="pending").length;
  if(comp.aud === "waitlist") return P.filter(p=>p.status==="waitlist").length;
  if(comp.aud === "next_week_due") return P.filter(p=>p.plan_type==="weekly"&&p.paid_weeks<6&&p.paid_weeks<Math.ceil(Math.max(adm.day,1)/7)+1).length;
  return 0;
}

function bindMessages(){
  const keep = () => { const e=$("#mEn"), f=$("#mFr"), t=$("#mTest"), tl=$("#mTestLang"); if(e) comp.en=e.value; if(f) comp.fr=f.value; if(t) comp.testNum=t.value; if(tl) comp.testLang=tl.value; };
  const r = $("#mRefresh"); if(r) r.onclick = loadMessages;
  document.querySelectorAll("[data-wamode]").forEach(b => b.onclick = async () => {
    try{ await rpc("gd_admin_set_wa_mode", {p_pin:admPin, p_mode:b.dataset.wamode}); admMeth = Object.assign(admMeth||{}, {wa_mode:b.dataset.wamode}); autoPrev = null; adminRender(); }
    catch(e){ alert("Could not change: " + e.message); } });
  document.querySelectorAll("[data-auto]").forEach(b => b.onclick = async () => {
    keep(); const k = b.dataset.auto, on = !admMsg["auto_"+k];
    if(on && !confirm(k==="morning" ? "Turn on the automatic 6:00 Daily Fire for everyone?" : "Turn on the automatic 20:00 reminder?")) return;
    try{ await rpc("gd_admin_set_auto", {p_pin:admPin, p_kind:k, p_on:on}); admMsg["auto_"+k] = on;
      autoNote = on ? `✓ ${k==="morning"?"Daily Fire":"Evening reminder"} is on.` : `✓ ${k==="morning"?"Daily Fire":"Evening reminder"} is off.`; adminRender(); }
    catch(e){ autoNote = "Could not change: " + e.message; adminRender(); }
  });
  const showPrev = async (k, day) => {
    keep();
    try{ const d = await callFn({pin:admPin, action:"preview", kind:k, day}); autoPrev = {...d, kind:k, day:d.day || day}; autoNote = ""; }
    catch(e){ autoNote = "Preview failed: " + (ERR_WA[e.message] || e.message); }
    adminRender();
  };
  document.querySelectorAll("[data-prev]").forEach(b => b.onclick = () => showPrev(b.dataset.prev, Math.min(42, Math.max(1, adm.day))));
  const pd = $("#pvDay"); if(pd) pd.onchange = () => showPrev(autoPrev.kind, +pd.value);
  const pc = $("#pvClose"); if(pc) pc.onclick = () => { autoPrev = null; adminRender(); };
  document.querySelectorAll("[data-now]").forEach(b => b.onclick = async () => {
    keep(); const k = b.dataset.now;
    if(adm.day < 1 || adm.day > 42){ autoNote = "The cohort isn't running today, so there is no Daily Fire to send. Use Preview to check any day."; adminRender(); return; }
    if(!confirm(k==="morning" ? `Send today's Daily Fire (day ${adm.day}) to everyone now?` : "Send the evening reminder now to everyone who hasn't filled today's card?")) return;
    try{ const d = await callFn({pin:admPin, action:"auto", kind:k});
      autoNote = d.skipped ? `Nothing sent (${d.skipped.replace(/_/g," ")}).` : `✓ Sending to ${d.total} ${d.total===1?"person":"people"}.`;
      await loadMessages(); }
    catch(e){ autoNote = ERR_WA[e.message] || ("Could not send: " + e.message); adminRender(); }
  });

  const wc = $("#waChange"); if(wc) wc.onclick = () => { showWaSetup = true; adminRender(); };
  const ws = $("#waSave");
  if(ws) ws.onclick = async () => {
    const i = $("#waInst").value.trim(), tk = $("#waTok").value.trim();
    if(!i || !tk){ alert("Enter both the instance ID and the access token."); return; }
    try{ await rpc("gd_admin_set_whatsapp", {p_pin:admPin, p_instance:i, p_token:tk}); showWaSetup = false; await loadMessages(); }
    catch(e){ alert("Could not save: " + e.message); }
  };
  const a = $("#mAud");
  if(a) a.onchange = () => { keep(); const [t, ...v] = a.value.split(":"); comp.aud = t; comp.val = v.join(":"); adminRender(); };
  const tl = $("#mTestLang"); if(tl) tl.onchange = keep;
  const f = $("#mFile");
  if(f) f.onchange = async () => {
    keep(); const file = f.files[0]; if(!file) return;
    if(file.size > 50*1024*1024){ comp.note = "File is over 50 MB. Compress it first."; adminRender(); return; }
    comp.note = "Uploading " + file.name + "…"; comp.busy = true; adminRender();
    try{ const fd = new FormData(); fd.append("pin", admPin); fd.append("file", file);
      comp.media = await callFn(fd, true); comp.note = "";
    }catch(e){ comp.note = "Upload failed: " + (ERR_WA[e.message] || e.message); }
    comp.busy = false; adminRender();
  };
  const rm = $("#mRemove"); if(rm) rm.onclick = () => { keep(); comp.media = null; adminRender(); };
  document.querySelectorAll("[data-errs]").forEach(b => b.onclick = () => {
    const m = admMsg.messages.find(x => String(x.id) === b.dataset.errs);
    alert((m.errors||[]).map(x => `${x.name} (+${x.phone}): ${x.detail}`).join("\n\n") || "No details.");
  });
  const s = $("#mSend");
  if(s) s.onclick = async () => {
    keep();
    const n = audienceCount();
    if(!comp.en.trim() && !comp.fr.trim() && !comp.media){ comp.note = ERR_WA.empty_message; adminRender(); return; }
    if(comp.aud !== "test" && !confirm(`Send this WhatsApp message to ${n} ${n===1?"person":"people"}?`)) return;
    comp.busy = true; comp.note = ""; adminRender();
    try{
      const audience = comp.aud === "test" ? {type:"test", value:comp.testNum, lang:comp.testLang} : {type:comp.aud, value:comp.val || null};
      const d = await callFn({pin:admPin, audience, text_en:comp.en, text_fr:comp.fr, media_url:comp.media?.url, media_name:comp.media?.name});
      comp.note = `✓ Sending to ${d.total} ${d.total===1?"person":"people"}. Progress shows below.`;
      if(comp.aud !== "test"){ comp.en = ""; comp.fr = ""; comp.media = null; }
    }catch(e){ comp.note = ERR_WA[e.message] || ("Could not send: " + e.message); }
    comp.busy = false; await loadMessages(); adminRender();
  };
}

/* ---------- offline: saved audio, cached data, queued cards ---------- */
const AUDIO_CACHE = "gd-audio-v1";
const blobUrls = {};
async function cachedAudio(url){
  if(!("caches" in window)) return null;
  if(blobUrls[url]) return blobUrls[url];
  try{ const c = await caches.open(AUDIO_CACHE); const r = await c.match(url); if(!r) return null; blobUrls[url] = URL.createObjectURL(await r.blob()); return blobUrls[url]; }catch(e){ return null; }
}
async function saveAudio(url){
  if(!("caches" in window) || !navigator.onLine) return false;
  try{ const c = await caches.open(AUDIO_CACHE); if(await c.match(url)) return true;
    const r = await fetch(url, {mode:"cors"}); if(!r.ok) return false; await c.put(url, r.clone());
    const keys = await c.keys(); if(keys.length > 14){ for(const k of keys.slice(0, keys.length - 14)) await c.delete(k); }
    return true; }catch(e){ return false; }
}
async function prepareAudio(){
  for(const el of document.querySelectorAll("audio[data-au]")){
    const url = el.dataset.au, st = document.querySelector(`[data-aus="${CSS.escape(url)}"]`);
    const local = await cachedAudio(url);
    if(local){ if(el.paused && el.src !== local) el.src = local; if(st){ st.textContent = t().auSaved; st.className = "small au-status ok"; } continue; }
    if(!navigator.onLine){ if(st){ st.textContent = t().auNot; st.className = "small au-status muted"; } continue; }
    if(st){ st.textContent = t().auSaving; st.className = "small au-status muted"; }
    saveAudio(url).then(ok => { if(st && ok){ st.textContent = t().auSaved; st.className = "small au-status ok"; } });
  }
}
function prefetchAudio(){
  if(!me || !navigator.onLine) return;
  (me.lessons || []).slice(-3).forEach(l => { [l.audio_url, l.audio_url_fr].filter(Boolean).forEach(u => saveAudio(u)); });
}
const pending = () => { try{ return JSON.parse(store.get("gd_pending") || "[]"); }catch(e){ return []; } };
async function flushPending(){
  const q = pending(); if(!q.length || !navigator.onLine) return;
  const left = [];
  for(const args of q){ try{ await rpc("gd_checkin", args); }catch(e){ if(e.message === "network") left.push(args); } }
  store.set("gd_pending", JSON.stringify(left));
  if(!left.length && q.length && $("#cardMsg") === null){ const b = document.createElement("div"); b.className = "toast"; b.textContent = t().synced; document.body.appendChild(b); setTimeout(()=>b.remove(), 3000); }
}
function offlineBar(){
  let b = document.getElementById("offbar");
  if(navigator.onLine){ if(b) b.remove(); return; }
  if(!b){ b = document.createElement("div"); b.id = "offbar"; b.setAttribute("role","status"); document.body.prepend(b); }
  b.textContent = "📴 " + t().offBar;
}
window.addEventListener("online", () => { offlineBar(); flushPending(); if(me) prepareAudio(); });
window.addEventListener("offline", offlineBar);
