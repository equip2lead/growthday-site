<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Growth Day Cohort</title>
<meta name="theme-color" content="#1C2340">
<link rel="icon" href="https://growthday.cc/growing-flame.png">
<link rel="apple-touch-icon" href="https://growthday.cc/growing-flame.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C2340; --text:#1C2340; --muted:#5B6480; --bg:#F3F6FB; --surface:#FFFFFF;
  --line:#D6DDEA; --ember:#E8890C; --glow:#FFC94D; --leaf:#2F855A; --danger:#B42318;
  --ember-text:#A35F00;
  --display:"Sora", "Segoe UI", system-ui, sans-serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --text:#EEF1F8; --muted:#A3ACC4; --bg:#121729; --surface:#1C2340; --line:#2E3758; --ember-text:#FFB547; }
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:400 17px/1.55 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding:20px 18px 110px}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0}
h1{font-size:30px;font-weight:700;letter-spacing:-.01em}
h2{font-size:22px;font-weight:600}
h3{font-size:17px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:15px}
.stack>*+*{margin-top:14px}
.stack-lg>*+*{margin-top:26px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:16px}
.brand img{width:34px;height:34px;object-fit:contain}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langs button{border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:6px 12px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:#fff}
@media (prefers-color-scheme: dark){.langs button[aria-pressed="true"]{background:var(--ember);color:#1C2340}}
label{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
input,textarea,select{width:100%;font:400 17px var(--body);color:var(--text);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ember)}
:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.hint{font-size:14px;color:var(--muted);margin-top:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;padding:15px 18px;font:600 17px var(--display);cursor:pointer;text-decoration:none}
.btn-primary{background:var(--ember);color:#1C2340}
.btn-dark{background:var(--ink);color:#fff}
@media (prefers-color-scheme: dark){.btn-dark{background:#2E3758}}
.btn-ghost{background:none;color:var(--text);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.55;cursor:default}
.link{background:none;border:0;padding:0;color:var(--ember-text);font:600 16px var(--body);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.err{color:var(--danger);font-weight:600;font-size:15px}
@media (prefers-color-scheme: dark){.err{color:#FF8A80}}
.ok{color:var(--leaf);font-weight:600}
@media (prefers-color-scheme: dark){.ok{color:#68D391}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.chips{display:grid;grid-template-columns:1fr;gap:8px}
.chip{text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:11px 14px;font:400 15px/1.35 var(--body);cursor:pointer}
.chip b{display:block;font-family:var(--display);font-weight:600;font-size:15.5px}
.chip[aria-pressed="true"]{border-color:var(--ember);box-shadow:inset 0 0 0 1.5px var(--ember)}
.chip[aria-pressed="true"] b::after{content:" ✓";color:var(--ember-text)}
.chip:disabled{opacity:.45}

/* hero */
.hero{background:var(--ink);color:#fff;border-radius:20px;padding:26px 22px;position:relative;overflow:hidden}
.hero .big{font-family:var(--display);font-size:44px;font-weight:700;line-height:1}
.hero .big span{font-size:20px;font-weight:500;opacity:.7}
.hero p{opacity:.85}
.hero .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:10px}
.streak{display:inline-flex;align-items:center;gap:6px;background:rgba(255,201,77,.15);color:var(--glow);border-radius:999px;padding:5px 12px;font-weight:600;font-size:15px;white-space:nowrap}

/* flames */
.flames{display:grid;grid-template-columns:28px repeat(7,1fr);gap:6px;align-items:center}
.flames .h{font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.flames .w{font-size:12px;color:var(--muted);font-weight:600}
.fl{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;background:none;border:0;padding:0;cursor:pointer;color:inherit}
.fl svg{width:78%;height:78%}
.fl.today{box-shadow:inset 0 0 0 2px var(--ember)}
.fl[disabled]{cursor:default}
.f-both path{fill:var(--ember);stroke:var(--ember)}
.f-one path{fill:var(--glow);stroke:var(--ember)}
.f-miss path{fill:none;stroke:var(--line)}
.f-future path{fill:none;stroke:var(--line);opacity:.45}
.f-open path{fill:none;stroke:var(--ember)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend svg{width:16px;height:16px}
.hero .flames .h,.hero .flames .w{color:rgba(255,255,255,.6)}
.hero .f-miss path,.hero .f-future path{stroke:rgba(255,255,255,.35)}

/* lesson */
.lesson .word{font-weight:600;color:var(--ember-text)}
.lesson .principle{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.3}
.action{border-left:4px solid var(--ember);padding:4px 0 4px 14px}
.action h3{font-size:15px;color:var(--muted);font-family:var(--body)}
audio{width:100%}

/* card */
.area-check{border-top:1px solid var(--line);padding-top:14px}
.toggle{display:flex;gap:8px;margin:10px 0}
.toggle button{flex:1;border:1.5px solid var(--line);background:none;color:var(--text);border-radius:10px;padding:11px;font:600 16px var(--body);cursor:pointer}
.toggle button[aria-pressed="true"].yes{background:var(--leaf);border-color:var(--leaf);color:#fff}
.toggle button[aria-pressed="true"].no{background:var(--line);border-color:var(--line)}
.range-row{display:flex;align-items:center;gap:12px}
.range-row input{padding:0;border:0;background:none;accent-color:var(--ember)}
.range-row output{font-family:var(--display);font-weight:700;font-size:22px;min-width:30px;text-align:right}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabs div{max-width:480px;margin:0 auto;display:flex}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:12px 4px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--ember-text)}

/* admin */
.admin .wrap{max-width:1100px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-family:var(--display);font-size:28px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:13.5px;white-space:nowrap}
tr.slip td:first-child{box-shadow:inset 4px 0 0 var(--danger)}
td input{padding:6px 8px;font-size:15px;min-width:90px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 14px;font:600 14px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--ember);color:var(--ember-text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.mini{display:inline-flex;gap:2px}
.mini i{width:8px;height:14px;border-radius:2px;background:var(--line);display:inline-block}
.mini i.on{background:var(--ember)}
@media (prefers-reduced-motion:no-preference){
  .fl.lit-now path{animation:ignite .6s ease-out}
  @keyframes ignite{from{transform:scale(.6);opacity:.3}to{transform:scale(1);opacity:1}}
  .fl path{transform-origin:50% 70%}
}
</style>
</head>

async function rpc(fn, args){
  let res;
  try{
    res = await fetch(API + fn, {method:"POST", headers:{"Content-Type":"application/json", apikey:KEY, Authorization:"Bearer "+KEY}, body:JSON.stringify(args||{})});
  }catch(e){ throw new Error("network"); }
  const txt = await res.text();
  let data = null; try{ data = txt ? JSON.parse(txt) : null }catch(e){}
  if(!res.ok){ throw new Error((data && data.message) || "network"); }
  return data;
}

    <div class="stack"><button class="btn btn-primary" id="submit">${t().join}</button>
    <button class="link" id="back">${t().back}</button></div></div>`;
  const keep = () => { draft.name = $("#name").value; draft.phone = $("#phone").value; };
  bindLang(() => { keep(); joinForm(); });
  document.querySelectorAll("[data-area]").forEach(b => b.onclick = () => {
    keep(); const n = +b.dataset.area;
    draft.areas = picked.includes(n) ? picked.filter(x=>x!==n) : [...picked, n].slice(0,2);
    joinForm();
    const el = document.querySelector(`[data-area="${n}"]`); if(el) el.focus();
  });
  $("#back").onclick = () => { keep(); welcome(); };
  $("#submit").onclick = async () => {
    keep();
    const pin = $("#pin").value.trim(), pin2 = $("#pin2").value.trim();
    const show = m => { $("#err").textContent = m; };
    if(draft.name.trim().length < 2) return show(t().err.name_required);
    if(draft.areas.length !== 2) return show(t().err.areas_needed);
    if(!/^\d{4}$/.test(pin)) return show(t().err.pin_invalid);
    if(pin !== pin2) return show(t().err.pin_mismatch);
    const btn = $("#submit"); btn.disabled = true;
    try{
      const tok = await rpc("gd_register", {p_name:draft.name, p_phone:draft.phone, p_lang:lang, p_area1:draft.areas[0], p_area2:draft.areas[1], p_pin:pin});
      store.set("gd_token", tok); draft = {name:"",phone:"",areas:[]}; boot();
    }catch(e){ btn.disabled = false; show(errMsg(e)); }
  };
}

function loginForm(){

/* ---------- participant: app ---------- */
let me = null, tab = "today", cardDay = null, lastSaved = null;

async function boot(){
  const tok = store.get("gd_token");
  if(!tok) return welcome();
  root.innerHTML = `<div class="wrap"><p class="muted">${t().loading}</p></div>`;
  try{
    me = await rpc("gd_me", {p_token: tok});
    if(!store.get("gd_lang")){ lang = me.lang; }
    document.documentElement.lang = lang;
    cardDay = null; renderApp();
  }catch(e){
    if(e.message === "session_expired"){ store.del("gd_token"); return loginForm(); }
    root.innerHTML = `<div class="wrap stack"><p class="err">${esc(errMsg(e))}</p><button class="btn btn-dark" onclick="boot()">↻</button></div>`;
  }
}

const areaName = n => AREAS[lang][n-1][0];
const L = (l, f) => (l && (l[f+"_"+lang] || l[f+"_en"])) || "";
const ck = d => me.checkins.find(c => c.day === d);
const state = d => { const c = ck(d); if(!c) return "miss"; return c.done1 && c.done2 ? "both" : (c.done1 || c.done2) ? "one" : "miss"; };
function streak(){
  const cur = Math.min(me.day, 42); let s = 0;
  let d = state(cur) !== "miss" ? cur : cur - 1;
  while(d >= 1 && state(d) !== "miss"){ s++; d--; }
  return s;
}
function flameGrid(onDark){
  const cur = me.day;
  let h = `<div class="flames"><span></span>${t().days.map(x=>`<span class="h">${x}</span>`).join("")}`;
  for(let w=1; w<=6; w++){
    h += `<span class="w">${lang==="fr"?"S":"W"}${w}</span>`;
    for(let i=1;i<=7;i++){
      const d = (w-1)*7+i;
      let cls = d > cur ? "future" : state(d);
      if(d === cur && cls === "miss") cls = "open";
      const lbl = `${t().dayDetail(d)}: ${cls==="both"?t().legBoth:cls==="one"?t().legOne:cls==="future"?t().legFut:t().legMiss}`;
      h += `<button class="fl f-${cls} ${d===cur?"today":""} ${lastSaved===d?"lit-now":""}" data-day="${d}" aria-label="${esc(lbl)}" ${d>cur?"disabled":""}>${FLAME}</button>`;
    }
  }
  return h + `</div>`;
}

function renderApp(){
  const cur = me.day;
  let body = "";
  if(tab === "today") body = cur < 1 ? viewBefore() : cur > 42 ? viewFinished() : viewToday();
  if(tab === "journey") body = viewJourney();
  if(tab === "me") body = viewMe();
  const icon = {
    today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    journey:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
    me:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>'
  };
  root.innerHTML = `<div class="wrap stack-lg">${header()}${body}</div>
    <nav class="tabs" aria-label="Main"><div>${["today","journey","me"].map(k=>`<button data-tab="${k}" ${tab===k?'aria-current="page"':""}>${icon[k]}${t()[k]}</button>`).join("")}</div></nav>`;
  bindLang(renderApp);
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; cardDay = null; renderApp(); window.scrollTo(0,0); });
  bindView();
  lastSaved = null;
}

function viewBefore(){
  const left = 1 - me.day;
  return `<section class="hero stack"><p>${t().startsTitle}</p>
      <p class="big">${left} <span>${t().daysLeft(left).replace(/^\D*\d+\s*/,"")}</span></p>
      <p>${t().starts(fmtDate(me.start_date))}</p></section>
    <section class="stack"><h2>${t().myAreas}</h2>
      ${[me.area1, me.area2].map(a=>`<div class="panel"><h3>${esc(areaName(a))}</h3><p class="muted small">${esc(AREAS[lang][a-1][1])}</p></div>`).join("")}
      <p class="muted">${t().beforeStart}</p></section>`;
}
function viewFinished(){
  return `<section class="hero stack"><h1>${t().finishedTitle}</h1><p>${t().finished}</p>${flameGrid(true)}</section>`;
}

function lessonBlock(l){
  if(!l) return "";
  const principle = L(l,"principle");
  const audio = l.audio_url ? (/\.(mp3|m4a|ogg|opus|wav|aac)(\?|$)/i.test(l.audio_url)
      ? `<audio controls preload="none" src="${esc(l.audio_url)}"></audio>`
      : `<a class="btn btn-dark" href="${esc(l.audio_url)}" target="_blank" rel="noopener">▶ ${t().listen}</a>`) : "";
  if(!principle) return `<section class="panel lesson stack"><h2>${esc(L(l,"title") || L(l,"theme"))}</h2>${audio}<p class="muted">${t().noLesson}</p></section>`;
  return `<section class="panel lesson stack">
    ${L(l,"word") ? `<p class="word">${t().word}: ${esc(L(l,"word"))}</p>` : ""}
    <h2>${esc(L(l,"title"))}</h2>
    <p class="principle">${esc(principle)}</p>
    ${L(l,"action") ? `<div class="action"><h3>${t().action}</h3><p>${esc(L(l,"action"))}</p></div>` : ""}
    ${audio}</section>`;
}

function cardBlock(d){
  const c = ck(d) || {};
  const areas = [[1, me.area1],[2, me.area2]];
  return `<section class="panel stack" id="card" data-d="${d}">
    <div><h2>${t().card}</h2><p class="muted small">${t().cardFor(d)} · ${t().cardQ}</p></div>
    ${areas.map(([k,a])=>`<div class="area-check">
      <h3>${esc(areaName(a))}</h3>
      <div class="toggle" role="group" aria-label="${esc(areaName(a))}">
        <button class="yes" data-k="${k}" data-v="1" aria-pressed="${!!c["done"+k]}">✓ ${t().yes}</button>
        <button class="no" data-k="${k}" data-v="0" aria-pressed="${c["done"+k]===false}">${t().no}</button>
      </div>
      <input id="note${k}" placeholder="${esc(t().notePh)}" value="${esc(c["note"+k]||"")}" maxlength="500" aria-label="${esc(t().notePh)}">
    </div>`).join("")}
    <p id="cardMsg" role="status"></p>
    <button class="btn btn-primary" id="saveCard">${t().save}</button>
  </section>`;
}

function scoreBlock(week){
  const s = me.scores.find(x=>x.week===week) || {score1:5, score2:5, reflection:""};
  return `<section class="panel stack" id="score" data-w="${week}">
    <div><h2>${t().scoreTitle}</h2><p class="muted small">${t().week(week)} · ${t().scoreQ}</p></div>
    ${[[1,me.area1],[2,me.area2]].map(([k,a])=>`<div><label for="s${k}">${esc(areaName(a))}</label>
      <div class="range-row"><input type="range" id="s${k}" min="1" max="10" value="${s["score"+k]}"><output id="o${k}">${s["score"+k]}</output></div></div>`).join("")}
    <div><label for="refl">${t().reflection}</label><textarea id="refl" maxlength="1000">${esc(s.reflection||"")}</textarea></div>
    <p id="scoreMsg" role="status"></p>
    <button class="btn btn-dark" id="saveScore">${t().saveScore}</button></section>`;
}

function viewToday(){
  const cur = me.day, week = Math.ceil(cur/7);
  const d = cardDay || cur;
  const lesson = me.lessons.find(l=>l.day===cur);
  const st = streak();
  const missedYesterday = cur > 1 && !ck(cur-1) && !cardDay;
  return `<section class="hero stack">
      <div class="row"><p class="big">${cur} <span>${t().of42}</span></p>${st?`<span class="streak">${t().streak(st)}</span>`:""}</div>
      <p>${t().week(week)} · ${esc(L(lesson,"theme"))}</p>
    </section>
    ${cardDay ? `<button class="link" id="toToday">${t().backToday}</button>` : lessonBlock(lesson)}
    ${missedYesterday ? `<div class="panel stack"><p>${t().catchUp}</p><button class="btn btn-ghost" id="catch">${t().catchBtn}</button></div>` : ""}
    ${cardBlock(d)}
    ${(cur % 7 === 0 && !cardDay) ? scoreBlock(week) : ""}`;
}

function viewJourney(){
  const scores = me.scores.length ? `<div class="tablewrap"><table><thead><tr><th>${lang==="fr"?"Semaine":"Week"}</th><th>${esc(areaName(me.area1))}</th><th>${esc(areaName(me.area2))}</th></tr></thead><tbody>
      ${me.scores.map(s=>`<tr><td>${s.week}</td><td>${s.score1}/10</td><td>${s.score2}/10</td></tr>`).join("")}</tbody></table></div>`
    : `<p class="muted">${t().noScores}</p>`;
  return `<section class="stack"><h1>${t().journey}</h1>
    <div class="panel">${me.day >= 1 ? flameGrid() : `<p class="muted">${t().starts(fmtDate(me.start_date))}</p>`}
      <div class="legend">
        <span class="f-both">${FLAME}${t().legBoth}</span><span class="f-one">${FLAME}${t().legOne}</span>
        <span class="f-miss">${FLAME}${t().legMiss}</span></div></div>
    <div id="detail"></div></section>
    <section class="stack"><h2>${t().scores}</h2>${scores}</section>`;
}

function viewMe(){
  const open = me.day <= 7;
  const picked = viewMe.picked || [me.area1, me.area2];
  return `<section class="stack"><h1>${esc(me.name)}</h1></section>
    <section class="stack"><h2>${t().myAreas}</h2>
      <p class="muted small">${open ? t().areasOpen : t().areasLocked}</p>
      <div class="chips">${AREAS[lang].map((a,i)=>{const on = picked.includes(i+1);
        return `<button class="chip" data-pick="${i+1}" aria-pressed="${on}" ${!open || (picked.length>=2 && !on) ? "disabled":""}><b>${esc(a[0])}</b>${esc(a[1])}</button>`}).join("")}</div>
      ${open ? `<p id="meMsg" role="status"></p><button class="btn btn-dark" id="saveMe">${t().saveChanges}</button>` : ""}
    </section>
    <section class="stack"><h2>${t().triad}</h2><div class="panel"><p>${me.triad ? esc(me.triad) : `<span class="muted">${t().noTriad}</span>`}</p></div></section>
    <button class="btn btn-ghost" id="signOut">${t().signOut}</button>`;
}

function bindView(){
  const tok = store.get("gd_token");
  // flames
  document.querySelectorAll(".fl[data-day]").forEach(b => b.onclick = () => {
    const d = +b.dataset.day; const box = $("#detail");
    if(tab === "today" || !box){ return; }
    const l = me.lessons.find(x=>x.day===d), c = ck(d);
    box.innerHTML = `<div class="panel stack"><h2>${t().dayDetail(d)} · ${esc(L(l,"title")||L(l,"theme"))}</h2>
      ${L(l,"principle")?`<p>${esc(L(l,"principle"))}</p>`:""}
      ${c ? [[1,me.area1],[2,me.area2]].map(([k,a])=>`<p><b>${esc(areaName(a))}:</b> ${c["done"+k]?"✓ "+t().yes:t().no}${c["note"+k]?" · "+esc(c["note"+k]):""}</p>`).join("") : `<p class="muted">${t().notFilled}</p>`}
      ${d >= me.day-1 && d <= me.day ? `<button class="btn btn-ghost" id="editDay">${t().editCard}</button>`:""}</div>`;
    const ed = $("#editDay"); if(ed) ed.onclick = () => { tab="today"; cardDay = d===me.day?null:d; renderApp(); };
    box.scrollIntoView({behavior:"smooth", block:"nearest"});
  });
  const tt = $("#toToday"); if(tt) tt.onclick = () => { cardDay = null; renderApp(); };
  const cu = $("#catch"); if(cu) cu.onclick = () => { cardDay = me.day-1; renderApp(); window.scrollTo(0,0); };
  // card
  const card = $("#card");
  if(card){
    const d = +card.dataset.d; const c = ck(d) || {};
    const val = {1: c.done1 ?? null, 2: c.done2 ?? null};
    card.querySelectorAll(".toggle button").forEach(b => b.onclick = () => {
      const k = b.dataset.k; val[k] = b.dataset.v === "1";
      b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    });
    $("#saveCard").onclick = async () => {
      const btn = $("#saveCard"); btn.disabled = true;
      try{
        const args = {p_token:tok, p_day:d, p_done1:!!val[1], p_done2:!!val[2], p_note1:$("#note1").value, p_note2:$("#note2").value};
        await rpc("gd_checkin", args);
        const row = {day:d, done1:args.p_done1, done2:args.p_done2, note1:args.p_note1, note2:args.p_note2};
        me.checkins = me.checkins.filter(x=>x.day!==d).concat(row);
        lastSaved = d; cardDay = null; renderApp();
        const m = $("#cardMsg"); if(m){ m.className="ok"; m.textContent = t().saved; }
      }catch(e){ btn.disabled = false; const m=$("#cardMsg"); m.className="err"; m.textContent = errMsg(e); }
    };
  }
  // score
  const sc = $("#score");
  if(sc){
    [1,2].forEach(k => { const r = $("#s"+k); r.oninput = () => { $("#o"+k).textContent = r.value; }; });
    $("#saveScore").onclick = async () => {
      const w = +sc.dataset.w; const btn = $("#saveScore"); btn.disabled = true;
      try{
        const a = {p_token:tok, p_week:w, p_s1:+$("#s1").value, p_s2:+$("#s2").value, p_reflection:$("#refl").value};
        await rpc("gd_score", a);
        me.scores = me.scores.filter(x=>x.week!==w).concat({week:w, score1:a.p_s1, score2:a.p_s2, reflection:a.p_reflection}).sort((x,y)=>x.week-y.week);
        btn.disabled = false; const m=$("#scoreMsg"); m.className="ok"; m.textContent = t().scoreSaved;
      }catch(e){ btn.disabled = false; const m=$("#scoreMsg"); m.className="err"; m.textContent = errMsg(e); }
    };
  }
  // me
  document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
    const n = +b.dataset.pick, p = viewMe.picked || [me.area1, me.area2];
    viewMe.picked = p.includes(n) ? p.filter(x=>x!==n) : [...p, n].slice(0,2); renderApp();
  });
  const sm = $("#saveMe");
  if(sm) sm.onclick = async () => {
    const p = viewMe.picked || [me.area1, me.area2]; const m = $("#meMsg");
    if(p.length !== 2){ m.className="err"; m.textContent = t().err.areas_needed; return; }
    sm.disabled = true;
    try{ await rpc("gd_update_profile", {p_token:tok, p_lang:lang, p_area1:p[0], p_area2:p[1]});
      me.area1 = p[0]; me.area2 = p[1]; viewMe.picked = null; renderApp();
      const m2 = $("#meMsg"); m2.className="ok"; m2.textContent = t().changesSaved;
    }catch(e){ sm.disabled = false; m.className="err"; m.textContent = errMsg(e); }
  };
  const so = $("#signOut"); if(so) so.onclick = () => { store.del("gd_token"); me = null; tab="today"; welcome(); };
}

/* ---------- admin ---------- */
let adm = null, admPin = null, admTab = "people", admFilter = "all", admDay = 1;
const AREA_SHORT = ["Personal","Spiritual","Relational","Mental","Career","Financial","Physical","Social","Vision"];

function adminLogin(msg){
  document.body.classList.add("admin");
  root.innerHTML = `<div class="wrap stack-lg" style="max-width:420px"><div class="brand"><img src="${LOGO}" alt="">Growth Day · Cohort admin</div>
    <div class="stack"><label for="apin">Admin PIN</label><input id="apin" type="password" inputmode="numeric" autocomplete="current-password">
    <p class="err" role="alert">${msg?esc(msg):""}</p><button class="btn btn-primary" id="ago">Open dashboard</button></div></div>`;
  const go = async () => { admPin = $("#apin").value.trim(); await adminLoad(); };
  $("#ago").onclick = go; $("#apin").onkeydown = e => { if(e.key==="Enter") go(); };
}
async function adminLoad(){
  try{ adm = await rpc("gd_admin_dashboard", {p_pin: admPin}); adminRender(); }
  catch(e){ adminLogin(e.message==="wrong_pin" ? "Wrong PIN." : e.message==="locked" ? "Locked for 15 minutes after too many tries." : "Could not load: " + e.message); }
}
function pStats(p){
  const cur = Math.min(adm.day, 42);
  const set = new Set(p.days); let s = 0, d = set.has(cur) ? cur : cur-1;
  while(d >= 1 && set.has(d)){ s++; d--; }
  const slipping = adm.day >= 2 && (!p.last_day || p.last_day < adm.day - 1);
  return {streak:s, total:p.days.length, slipping};
}
function adminRender(){
  const P = adm.participants, cur = adm.day;
  const today = P.filter(p => p.days.includes(cur)).length;
  const slip = P.filter(p => pStats(p).slipping).length;
  const triads = [...new Set(P.map(p=>p.triad).filter(Boolean))].sort();
  let list = P;
  if(admFilter === "slip") list = P.filter(p=>pStats(p).slipping);
  else if(admFilter.startsWith("t:")) list = P.filter(p=>p.triad===admFilter.slice(2));
  else if(admFilter === "none") list = P.filter(p=>!p.triad);

  const peopleView = `
    <div class="seg" role="group" aria-label="Filter">
      <button data-f="all" aria-pressed="${admFilter==="all"}">Everyone (${P.length})</button>
      <button data-f="slip" aria-pressed="${admFilter==="slip"}">Slipping (${slip})</button>
      <button data-f="none" aria-pressed="${admFilter==="none"}">No triad</button>
      ${triads.map(x=>`<button data-f="t:${esc(x)}" aria-pressed="${admFilter==="t:"+x}">${esc(x)}</button>`).join("")}
    </div>
    <div class="tablewrap"><table><thead><tr><th>Name</th><th>WhatsApp</th><th>Areas</th><th>Triad</th><th>Last 7 days</th><th>Streak / total</th><th>Latest score</th><th></th></tr></thead><tbody>
    ${list.map(p => { const s = pStats(p); const sc = p.scores[p.scores.length-1];
      const last7 = Array.from({length:7},(_,i)=>cur-6+i).map(d=>`<i class="${d>=1 && p.days.includes(d)?"on":""}" title="Day ${d}"></i>`).join("");
      const first = p.name.split(" ")[0];
      const msg = p.lang==="fr" ? `Bonjour ${first}, c'est l'équipe Growth Day. Comment avancez-vous avec votre 1 % ?` : `Hi ${first}, it's the Growth Day team. How is your 1% going?`;
      return `<tr class="${s.slipping?"slip":""}">
        <td><b>${esc(p.name)}</b><br><span class="muted small">${p.lang.toUpperCase()}</span></td>
        <td><a href="https://wa.me/${esc(p.phone)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">+${esc(p.phone)}</a></td>
        <td class="small">${AREA_SHORT[p.area1-1]}<br>${AREA_SHORT[p.area2-1]}</td>
        <td><input value="${esc(p.triad||"")}" data-triad="${p.id}" placeholder="e.g. Triad 1" aria-label="Triad for ${esc(p.name)}"></td>
        <td><span class="mini">${last7}</span></td>
        <td>${s.streak} / ${s.total}</td>
        <td>${sc ? `W${sc.week}: ${sc.score1} · ${sc.score2}` : "—"}</td>
        <td><button class="link" data-reset="${p.id}" data-name="${esc(p.name)}">Reset PIN</button></td></tr>`; }).join("") || `<tr><td colspan="8" class="muted">No one here yet.</td></tr>`}
    </tbody></table></div>
    <p class="muted small">Triad names save when you leave the box. Red edge = no card yesterday or today. Tap a number to message them on WhatsApp.</p>
    <button class="btn btn-ghost" id="csv" style="max-width:260px">Download CSV</button>`;

  const l = adm.lessons.find(x=>x.day===admDay) || {};
  const f = (k, label, area) => `<div><label for="${k}">${label}</label>${area?`<textarea id="${k}">${esc(l[k]||"")}</textarea>`:`<input id="${k}" value="${esc(l[k]||"")}">`}</div>`;
  const lessonsView = `
    <div class="stack" style="max-width:780px">
      <div><label for="lday">Day</label><select id="lday">${adm.lessons.map(x=>`<option value="${x.day}" ${x.day===admDay?"selected":""}>Day ${x.day} · Week ${x.week} ${x.day%7===0?"(Sunday · score day)":""} ${x.principle_en?"":"· empty"}</option>`).join("")}</select></div>
      <div class="grid2">
        <div class="stack"><h3>English</h3>${f("title_en","Title")}${f("word_en","Word (scripture reference)")}${f("principle_en","Principle",1)}${f("action_en","1% micro-action",1)}</div>
        <div class="stack"><h3>Français</h3>${f("title_fr","Titre")}${f("word_fr","Parole (référence)")}${f("principle_fr","Principe",1)}${f("action_fr","Micro-action 1 %",1)}</div>
      </div>
      ${f("audio_url","Audio link (optional: Google Drive, SoundCloud, or a direct .mp3 link)")}
      <p id="lmsg" role="status"></p>
      <button class="btn btn-primary" id="lsave" style="max-width:260px">Save day ${admDay}</button>
      <p class="muted small">Participants only see a day's lesson once that day arrives. If a day has no principle, the app tells them to listen to the Daily Fire on WhatsApp.</p>
    </div>`;

  const settingsView = `<div class="stack" style="max-width:420px">
      <div><label for="sdate">Cohort start date (day 1, a Monday)</label><input type="date" id="sdate" value="${esc(adm.start_date)}"></div>
      <button class="btn btn-dark" id="ssave">Save start date</button>
      <div><label for="npin">New admin PIN (6+ digits)</label><input id="npin" inputmode="numeric"></div>
      <button class="btn btn-ghost" id="psave">Change admin PIN</button>
      <p id="smsg" role="status"></p></div>`;

  root.innerHTML = `<div class="wrap stack-lg">
    <div class="top"><div class="brand"><img src="${LOGO}" alt="">Growth Day · Cohort admin</div><button class="link" id="refresh">Refresh</button></div>
    <div class="stats">
      <div class="stat"><b>${cur<1?`Starts in ${1-cur}d`:cur>42?"Finished":`Day ${cur}`}</b><span class="muted small">${cur>=1&&cur<=42?`Week ${Math.ceil(cur/7)}`:fmtDate(adm.start_date)}</span></div>
      <div class="stat"><b>${P.length}</b><span class="muted small">Participants</span></div>
      <div class="stat"><b>${cur>=1&&cur<=42?today:"—"}</b><span class="muted small">Cards filled today</span></div>
      <div class="stat"><b>${slip}</b><span class="muted small">Slipping</span></div>
    </div>
    <div class="seg" role="tablist">${[["people","People"],["lessons","Daily lessons"],["settings","Settings"]].map(([k,n])=>`<button data-at="${k}" aria-pressed="${admTab===k}">${n}</button>`).join("")}</div>
    ${admTab==="people"?peopleView:admTab==="lessons"?lessonsView:settingsView}
  </div>`;

  $("#refresh").onclick = adminLoad;
  document.querySelectorAll("[data-at]").forEach(b=>b.onclick=()=>{admTab=b.dataset.at; adminRender();});
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{admFilter=b.dataset.f; adminRender();});
  document.querySelectorAll("[data-triad]").forEach(inp => inp.onchange = async () => {
    try{ await rpc("gd_admin_set_triad",{p_pin:admPin, p_id:inp.dataset.triad, p_triad:inp.value});
      const p = adm.participants.find(x=>x.id===inp.dataset.triad); p.triad = inp.value.trim()||null; inp.style.borderColor="var(--leaf)";
    }catch(e){ alert("Could not save triad: "+e.message); }
  });
  document.querySelectorAll("[data-reset]").forEach(b => b.onclick = async () => {
    const np = prompt(`New 4-digit PIN for ${b.dataset.name}:`); if(!np) return;
    try{ await rpc("gd_admin_reset_pin",{p_pin:admPin, p_id:b.dataset.reset, p_new:np.trim()}); alert("PIN reset. Send it to them on WhatsApp."); }
    catch(e){ alert(e.message==="pin_invalid"?"The PIN must be 4 digits.":"Could not reset: "+e.message); }
  });
  const csv = $("#csv");
  if(csv) csv.onclick = () => {
    const rows = [["Name","Phone","Language","Area 1","Area 2","Triad","Days with a card","Streak","Last day","Scores"]]
      .concat(adm.participants.map(p=>{const s=pStats(p);return [p.name,"+"+p.phone,p.lang,AREA_SHORT[p.area1-1],AREA_SHORT[p.area2-1],p.triad||"",s.total,s.streak,p.last_day||"",p.scores.map(x=>`W${x.week}:${x.score1}/${x.score2}`).join(" ")]}));
    const blob = new Blob(["\ufeff"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n")], {type:"text/csv"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "growth-day-cohort.csv"; a.click();
  };
  const ld = $("#lday"); if(ld) ld.onchange = () => { admDay = +ld.value; adminRender(); };
  const ls = $("#lsave");
  if(ls) ls.onclick = async () => {
    const keys = ["title_en","title_fr","word_en","word_fr","principle_en","principle_fr","action_en","action_fr","audio_url"];
    const p = {}; keys.forEach(k => p[k] = $("#"+k).value.trim() || null);
    ls.disabled = true;
    try{ await rpc("gd_admin_save_lesson",{p_pin:admPin, p_day:admDay, p});
      Object.assign(adm.lessons.find(x=>x.day===admDay), p); ls.disabled=false;
      const m=$("#lmsg"); m.className="ok"; m.textContent=`Day ${admDay} saved.`;
    }catch(e){ ls.disabled=false; const m=$("#lmsg"); m.className="err"; m.textContent="Could not save: "+e.message; }
  };
  const ss = $("#ssave");
  if(ss) ss.onclick = async () => { const m=$("#smsg");
    try{ await rpc("gd_admin_set_start",{p_pin:admPin, p_date:$("#sdate").value}); await adminLoad(); }
    catch(e){ m.className="err"; m.textContent="Could not save: "+e.message; } };
  const ps = $("#psave");
  if(ps) ps.onclick = async () => { const m=$("#smsg"); const np=$("#npin").value.trim();
    try{ await rpc("gd_admin_change_pin",{p_pin:admPin, p_new:np}); admPin = np; m.className="ok"; m.textContent="Admin PIN changed."; }
    catch(e){ m.className="err"; m.textContent = e.message==="pin_invalid"?"Use at least 6 digits.":"Could not change: "+e.message; } };
}

/* ---------- start ---------- */
document.documentElement.lang = lang;
if(location.hash === "#admin") adminLogin(); else boot();
window.addEventListener("hashchange", () => { if(location.hash === "#admin") adminLogin(); else { document.body.classList.remove("admin"); boot(); } });
</script>
</body>
</html>
